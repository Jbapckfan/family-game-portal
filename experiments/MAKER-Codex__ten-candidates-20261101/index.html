function make6(r) {const values=shuffle(r,[1,2,3,4,5,6,7,8,9]).slice(0,6),solution=shuffle(r,[0,1,2,3,4,5]);const p={kind:6,values,clues:[]};const possible=[];for(let len=2;len<=3;len++)for(let s=0;s<=6-len;s++)possible.push({type:'sum',s,len,value:solution.slice(s,s+len).reduce((n,i)=>n+values[i],0)});for(let a=0;a<6;a++)for(let b=a+1;b<6;b++){possible.push({type:'before',a:solution[a],b:solution[b]});if(b-a<=3)possible.push({type:'gap',a:solution[a],b:solution[b],gap:b-a});if(values[solution[a]]>values[solution[b]])possible.push({type:'compare',a,b});else possible.push({type:'compare',a:b,b:a});}let remaining=PERMS6;const pool=shuffle(r,possible);while(remaining.length>1){const useful=pool.map(c=>({c,left:remaining.filter(o=>cluePass(p,o,c))})).filter(v=>v.left.length&&v.left.length<remaining.length).sort((a,b)=>a.left.length-b.left.length);if(!useful.length)throw Error('06 no distinguishing clue');const chosen=useful[int(r,Math.min(5,useful.length))];p.clues.push(chosen.c);remaining=chosen.left;pool.splice(pool.indexOf(chosen.c),1);}p.solution=solution;p.par=null;p.identity=[false,true].map(reflect=>key([[...values].sort((a,b)=>a-b),p.clues.map(c=>{if(c.type==='sum')return['sum',reflect?6-c.s-c.len:c.s,c.len,c.value];if(c.type==='compare')return['compare',reflect?5-c.a:c.a,reflect?5-c.b:c.b];if(c.type==='before')return['before',values[reflect?c.b:c.a],values[reflect?c.a:c.b]];return['gap',...[values[c.a],values[c.b]].sort((a,b)=>a-b),c.gap];}).map(key).sort()])).sort()[0];return p;}

// 07: finite abelian cascade with boundary sinks. Every square must fire.
function cascade(charges,cell,fired=0,reverse=false) {const a=[...charges];a[cell]++;const queue=a.map((v,i)=>v>=4?i:-1).filter(i=>i>=0),events=[];let mask=fired;while(queue.length){const c=reverse?queue.pop():queue.shift();if(a[c]<4)continue;a[c]-=4;mask|=1<<c;events.push(c);if(events.length>20000)throw Error('Cascade did not stabilize');const x=c%4,y=Math.floor(c/4);for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(nx>=0&&nx<4&&ny>=0&&ny<4){const n=ny*4+nx;a[n]++;if(a[n]>=4)queue.push(n);}}if(a[c]>=4)queue.push(c);}return{charges:a,fired:mask,events};}
function cascadeSolve(p,max=3,limit=1000) {const found=[];function visit(a,mask,path,min,depth){if(mask===65535){found.push(path);return;}if(!depth||found.length>=limit)return;for(let c=min;c<16;c++){const next=cascade(a,c,mask);visit(next.charges,next.fired,[...path,c],c,depth-1);}}for(let d=1;d<=max;d++){visit(p.charges,0,[],0,d);if(found.length)return found;}return[];}
function make7(r) {for(let t=0;t<3000;t++){const charges=Array.from({length:16},()=>{const x=r();return x<.15?1:x<.7?2:3;});const p={kind:7,charges,budget:3};const solutions=cascadeSolve(p,3,100);if(!solutions.length||solutions[0].length!==3||solutions.length>35)continue;p.solution=solutions[0];p.par=3;p.minimumSolutions=solutions.length;p.identity=Array.from({length:8},(_,t)=>{const out=[];charges.forEach((v,c)=>out[transformCell(c,4,t)]=v);return key(out);}).sort()[0];return p;}throw Error('07 generation exhausted');}

// 08: discrete, deterministic ballistics. Aiming, not input latency, decides outcomes.
function trajectory(angle,power,wind) {const radians=angle*Math.PI/180,vx=power*Math.cos(radians),vy=power*Math.sin(radians),time=2*vy/9.8;return{distance:vx*time+.5*wind*time*time,time,points:Array.from({length:41},(_,i)=>{const t=time*i/40;return[vx*t+.5*wind*t*t,vy*t-4.9*t*t];})};}
function make8(r) {const stages=[];for(let i=0;i<3;i++){let s;do{const angle=30+int(r,8)*5,power=10+int(r,7),wind=(int(r,41)-20)/10,target=Math.round(trajectory(angle,power,wind).distance*10)/10;s={target,wind,solution:{angle,power}};}while(s.target<11||s.target>35);stages.push(s);}return{kind:8,stages,par:3,solution:stages.map(s=>s.solution),identity:key(stages.map(s=>[s.target,s.wind]))};}

// 09: perfect-information alternating draft, rival uses exact minimax.
function draftDistance(p,mask,who) {const total=[0,0];p.cards.forEach((a,i)=>{if(mask&(1<<i)){total[0]+=a[0];total[1]+=a[1];}});return Math.abs(total[0]-p.targets[who][0])+Math.abs(total[1]-p.targets[who][1]);}
function draftSolver(p) {const memo=new Map(),full=1023;function value(h,a){const k=h*1024+a;if(memo.has(k))return memo.get(k);const used=h|a;if(used===full)return draftDistance(p,a,1)-draftDistance(p,h,0);const count=used.toString(2).replaceAll('0','').length,human=count%2===0;let best=human?-Infinity:Infinity;for(let i=0;i<10;i++)if(!(used&(1<<i))){const v=human?value(h|(1<<i),a):value(h,a|(1<<i));best=human?Math.max(best,v):Math.min(best,v);}memo.set(k,best);return best;}function choose(h,a,human){let best=human?-Infinity:Infinity,move=-1;for(let i=0;i<10;i++)if(!((h|a)&(1<<i))){const v=human?value(h|(1<<i),a):value(h,a|(1<<i));if((human&&v>best)||(!human&&v<best)){best=v;move=i;}}return move;}return{value,choose,memo};}
function make9(r) {for(let t=0;t<200;t++){const cards=Array.from({length:10},()=>[int(r,6),int(r,6)]);if(new Set(cards.map(key)).size<9)continue;const p={kind:9,cards,targets:[[9+int(r,8),9+int(r,8)],[9+int(r,8),9+int(r,8)]]};const solver=draftSolver(p),v=solver.value(0,0);if(v<1||v>5)continue;let h=0,a=0;const solution=[];for(let turn=0;turn<10;turn++){const human=turn%2===0,m=solver.choose(h,a,human);solution.push(m);if(human)h|=1<<m;else a|=1<<m;}p.solution=solution;p.margin=v;p.par=null;p.identity=key([[...cards].map(key).sort(),p.targets]);return p;}throw Error('09 generation exhausted');}

// 10: six commands, repeated three times. The board supplies the constraints.
function runProgram(p,program) {let cell=p.start,face=p.face,mask=0;const steps=[];for(let cycle=0;cycle<3;cycle++)for(let slot=0;slot<6;slot++){const command=program[slot];if(command==='L')face=(face+3)%4;else if(command==='R')face=(face+1)%4;else if(command==='F'){const[x,y]=[cell%6,Math.floor(cell/6)],[dx,dy]=DIRS[face],nx=x+dx,ny=y+dy,next=ny*6+nx;if(nx<0||nx>=6||ny<0||ny>=6||p.walls.includes(next))return{cell,face,mask,steps,crashed:true,cycle,slot};cell=next;}else return{cell,face,mask,steps,crashed:true,cycle,slot};const b=p.beacons.indexOf(cell);if(b>=0)mask|=1<<b;steps.push({cell,face,mask,cycle,slot});}return{cell,face,mask,steps,crashed:false,won:cell===p.goal&&face===p.goalFace&&mask===7};}
function programSolve(p) {const out=[];for(let code=0;code<729;code++){let n=code;const a=[];for(let i=0;i<6;i++){a.push(['F','L','R'][n%3]);n=Math.floor(n/3);}if(runProgram(p,a).won)out.push(a);}return out;}
function make10(r) {for(let t=0;t<10000;t++){const program=shuffle(r,['F','F','F',r()<.5?'L':'R','L','R']);const start=int(r,36),face=int(r,4),base={start,face,walls:[],beacons:[]};const run=runProgram(base,program);if(run.crashed)continue;const route=[...new Set(run.steps.map(s=>s.cell))].filter(c=>c!==start&&c!==run.cell);if(route.length<4)continue;const beacons=shuffle(r,route).slice(0,3).sort((a,b)=>a-b),traversed=new Set([start,...run.steps.map(s=>s.cell)]),walls=shuffle(r,Array.from({length:36},(_,i)=>i).filter(c=>!traversed.has(c))).slice(0,6+int(r,5)).sort((a,b)=>a-b);const p={kind:10,start,face,walls,beacons,goal:run.cell,goalFace:run.face};const solutions=programSolve(p);if(solutions.length!==1)continue;p.solution=solutions[0];p.par=6;p.identity=Array.from({length:8},(_,t)=>{const facing=f=>((t>=4?-f:f)+t%4+8)%4;return key([walls.map(c=>transformCell(c,6,t)).sort((a,b)=>a-b),transformCell(start,6,t),facing(face),beacons.map(c=>transformCell(c,6,t)).sort((a,b)=>a-b),transformCell(p.goal,6,t),facing(p.goalFace)]);}).sort()[0];return p;}throw Error('10 generation exhausted');}

const MAKERS=[null,make1,make2,make3,make4,make5,make6,make7,make8,make9,make10];
function generate(kind,seed){const p=MAKERS[kind](rng(seed));p.seed=seed;return p;}

function study(){stopAnimation();history.push(copy(s));const n=initialState(p);n.moves=s.moves;n.checks=s.checks;n.undos=s.undos||0;n.assisted=true;if(kind===1)n.data=[...p.goal];if(kind===2)n.data=[...p.solution];if(kind===3){n.data=[...p.start];for(const[a,b]of p.solution)[n.data[a],n.data[b]]=[n.data[b],n.data[a]];}if(kind===4)n.data=[...p.solution];if(kind===5)for(const o of p.solution)n.data[o.piece]=copy(o);if(kind===6){n.data=[...p.solution];n.lastCheck=true;}if(kind===7)for(const cell of p.solution){const next=cascade(n.data.charges,cell,n.data.fired);n.data={charges:next.charges,fired:next.fired,pulses:[...n.data.pulses,cell]};}if(kind===8){n.data.stage=3;n.data.shots=p.solution.map((shot,stage)=>({...shot,stage,error:trajectory(shot.angle,shot.power,p.stages[stage].wind).distance-p.stages[stage].target,hit:true,bullseye:true}));}if(kind===9){p.solution.forEach((i,turn)=>{if(turn%2===0)n.data.human|=1<<i;else n.data.ai|=1<<i;});n.data.picks=[...p.solution];}if(kind===10){n.data=[...p.solution];n.lastRun=runProgram(p,n.data);}n.status='won';s=n;selected=null;store();render();notify('An assisted solution is shown. Undo to return to your previous position.');}
function imageBlob(){return new Promise(resolve=>{const c=document.createElement('canvas');c.width=1080;c.height=1350;const g=c.getContext('2d');g.fillStyle='#08151f';g.fillRect(0,0,1080,1350);const grad=g.createLinearGradient(0,0,1080,1350);grad.addColorStop(0,'#153b53');grad.addColorStop(1,'#08151f');g.fillStyle=grad;g.fillRect(45,45,990,1260);g.fillStyle='#67dfff';g.font='bold 32px sans-serif';g.fillText('ALFORD DAILY · EXPERIMENTAL',100,130);g.fillStyle='#f4fbff';g.font='bold 80px sans-serif';g.fillText(`Candidate ${String(kind).padStart(2,'0')}`,100,260);g.font='36px sans-serif';g.fillStyle='#bad2df';g.fillText(edition(),100,330);const text=shareText(kind,edition(),s).split('\n');g.font='bold 56px sans-serif';g.fillStyle='#66e7c3';g.fillText(text[2],100,660);g.font='38px sans-serif';g.fillStyle='#f4fbff';g.fillText(text[3],100,740);g.fillText(text[4],100,805);for(let i=0;i<10;i++){g.fillStyle=i+1===kind?'#63dfff':'#224253';g.beginPath();g.roundRect(100+i*86,445,64,64,12);g.fill();}g.font='32px sans-serif';g.fillStyle='#bad2df';g.fillText('Same challenge. Your own result.',100,1110);g.font='28px sans-serif';g.fillText('No spoilers. Human keeper verdict pending.',100,1170);c.toBlob(resolve,'image/png');});}
async function shareAction(action){const status=$('#share-status'),text=shareText(kind,edition(),s);if(action==='copy'){try{await navigator.clipboard.writeText(text);status.textContent='Result text copied.';}catch{$('#share-text').focus();$('#share-text').select();status.textContent='Clipboard access is unavailable here. The result is selected; use Copy.';}}if(action==='native-share'){if(!navigator.share){status.textContent='System sharing is unavailable here. Copy text or download the image.';return;}try{await navigator.share({title:`Alford Daily Candidate ${kind}`,text});status.textContent='Shared through your selected app.';}catch{status.textContent='Sharing closed. Your result stays here.';}}if(action==='image'){const blob=await imageBlob();if(!blob){status.textContent='Image creation failed. Your text result is still available.';return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`MAKER-Codex__candidate-${String(kind).padStart(2,'0')}-${practice?'practice-'+(index+1):BANK.dates[index]}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);status.textContent='PNG download started. It includes only edition, status and attempt totals.';}}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-action]');if(!b||b.disabled)return;if(b.dataset.open){openGame(Number(b.dataset.open));return;}if(b.dataset.wave){const[i,to]=b.dataset.wave.split(':').map(Number);waveShift(i,to);return;}if(b.dataset.node!==undefined){selectSwap(Number(b.dataset.node),'node');return;}if(b.dataset.artifact!==undefined){selectSwap(Number(b.dataset.artifact),'artifact');return;}if(b.dataset.op!==undefined){if(s.status!=='playing')return;const i=Number(b.dataset.op),current=s.data.reduce((n,j)=>operate(n,p.ops[j]),p.start),next=operate(current,p.ops[i]);if(next===null){notify('That key cannot be used at this value. No move was spent.');return;}commit(n=>{n.data.push(i);if(n.data.length===6&&next===p.target)done(n);});notify(s.status==='won'?'Every key used. Exact target reached.':`Now ${next}. ${6-s.data.length} keys remain.`);return;}if(b.dataset.piece!==undefined){selected=Number(b.dataset.piece);orientation=0;render();notify(`Piece ${String.fromCharCode(65+selected)} selected. Choose an orientation and position.`);return;}if(b.dataset.cell!==undefined){if(kind===5)putPiece(Number(b.dataset.cell));if(kind===7)pulse(Number(b.dataset.cell));return;}if(b.dataset.draft!==undefined){draft(Number(b.dataset.draft));return;}if(b.dataset.command){chosenCommand=b.dataset.command;render();return;}if(b.dataset.slot!==undefined){if(s.status==='won'){notify('Undo or reset to edit this completed program.');return;}const i=Number(b.dataset.slot);if(s.data[i]===chosenCommand)return;commit(n=>{n.data[i]=chosenCommand;n.lastRun=null;});notify(`Command ${i+1} set to ${chosenCommand==='F'?'Forward':chosenCommand==='L'?'Left':'Right'}.`);return;}const action=b.dataset.action;if(action==='home'){e.preventDefault();stopAnimation();kind=0;lastToast='';render();window.scrollTo({top:0,behavior:'instant'});return;}if(action==='undo'){undo();return;}if(action==='reset'){reset();return;}if(action==='replay'){practice=true;index=(index+1)%182;lastToast='';load();render();return;}if(action==='share'){$('#share-dialog').showModal();return;}if(action==='close-share'){$('#share-dialog').close();return;}if(['copy','native-share','image'].includes(action)){shareAction(action);return;}if(action==='solution'){study();return;}if(action?.startsWith('dir')){moveDirection(Number(action.slice(3)));return;}if(action?.startsWith('shift')){const[i,d]=action.slice(5).split(':').map(Number);waveShift(i,s.data[i]+d);return;}if(action?.startsWith('orient')){orientation=(orientation+Number(action.slice(6))+orientations(p.shapes[selected]).length)%orientations(p.shapes[selected]).length;render();return;}if(action==='check-order'){commit(n=>{n.checks++;n.lastCheck=true;if(p.clues.every(c=>cluePass(p,n.data,c)))done(n);},{moves:0});notify(s.status==='won'?'Every clue agrees.':`${p.clues.filter(c=>cluePass(p,s.data,c)).length} of ${p.clues.length} clues agree. Keep deducing.`);return;}if(action==='launch'){launch();return;}if(action==='run'){commit(n=>{n.lastRun=runProgram(p,n.data);if(n.lastRun.won)done(n);});notify(s.lastRun.won?'Three loops, three beacons, exact arrival.':s.lastRun.crashed?`Blocked in loop ${s.lastRun.cycle+1}, command ${s.lastRun.slot+1}.`:'Run finished. Check beacons, goal and facing.');}});
document.addEventListener('change',e=>{if(e.target.id==='run-step'){runStep=Number(e.target.value);render();return;}if(e.target.id==='date'){const i=BANK.dates.indexOf(e.target.value);if(i<0){notify('Choose a date from the prepared range.');return;}index=i;practice=false;lastToast='';load();render();}if(e.target.id==='angle'||e.target.id==='power'){s.data[e.target.id]=Number(e.target.value);store();render();}});
document.addEventListener('keydown',e=>{if(kind===1&&!$('#share-dialog')?.open&&!['INPUT','TEXTAREA','SELECT','BUTTON','A'].includes(e.target.tagName)&&['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key)){e.preventDefault();moveDirection(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].indexOf(e.key));}});
// QA can inspect state without reading hidden solutions. No action is auto-played.
window.candidateLab={snapshot:()=>({kind,index,practice,state:copy(s),historyLength:history.length}),open:openGame};
render();

})();</script></body></html>
