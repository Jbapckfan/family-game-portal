<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lasers 3D render harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #050817; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage"><canvas id="board"></canvas></div>
<script src="../vendor/three.min.js"></script>
<script src="../src/pieces.js"></script>
<script src="../src/sim.js"></script>
<script src="../src/levels.js"></script>
<script src="../src/theme.js"></script>
<script src="../src/render-core.js"></script>
<script src="../src/render-camera.js"></script>
<script src="../src/render-terrain.js"></script>
<script src="../src/render-pieces.js"></script>
<script src="../src/render-beam.js"></script>
<script src="../src/render.js"></script>
<script>
(function () {
  'use strict';

  /* ---- synthetic levels. `big` builds an NxN board with varied terrain (0..3), several pieces and a real beam,
   * so the camera fit, the min-cell clamp, picking and the frame time are measured on the shipping sizes. ---- */
  function bigLevel(n) {
    var rows = [], x, y, h, row;
    /* Deterministic pseudo-terrain: ridges, a plateau and scattered low walls, with four clear corridors
     * (y = 1, y = n-2, x = 1, x = n-3) so the traced beam runs a full lap of the board. */
    function clear(x2, y2) { return y2 === 1 || y2 === n - 2 || x2 === 1 || x2 === n - 3; }
    for (y = 0; y < n; y++) {
      row = '';
      for (x = 0; x < n; x++) {
        h = 0;
        if ((x * 7 + y * 13) % 11 === 0) h = 1;
        if ((x + y) % 9 === 0 && x > 1 && y > 1) h = 2;
        if (x > n * 0.55 && x < n * 0.75 && y > n * 0.55 && y < n * 0.75) h = 3;
        if (x % 5 === 2 && y % 6 === 4) h = 1;
        if (clear(x, y)) h = 0;
        row += String(h);
      }
      rows.push(row);
    }
    /* emitter (0,1) fires E -> fixed MIRROR '/' at (n-3,1) turns it N -> MIRROR '\\' at (n-3,n-2) turns it W
     * -> MIRROR '/' at (1,n-2) turns it S -> straight down column x=1 into the target at (1,3). */
    return {
      raw: {
        name: n + 'x' + n, par: 3, size: { w: n, d: n }, terrain: rows,
        emitter: { x: 0, y: 1, dir: 'E' },
        targets: [{ x: 1, y: 3 }],
        fixed: [{ x: n - 3, y: 1, type: 'MIRROR', orient: '/', secret: false }],
        tray: ['MIRROR', 'WEDGE', 'DIP']
      },
      placed: [
        { x: n - 3, y: n - 2, type: 'MIRROR', orient: '\\' },
        { x: 1, y: n - 2, type: 'MIRROR', orient: '/' },
        { x: 4, y: 4, type: 'WEDGE', orient: '/' },
        { x: 7, y: 7, type: 'DIP', orient: '\\' }
      ]
    };
  }

  /* ---- ARCHES AND WINDOWS (DESIGN.md 13) -------------------------------------------------------------------
   * A 12x12 board (big enough that a 393 px phone hits theme.camera.minCellPx = 34 px, which is the size the light
   * leak of 13.3 has to survive) carrying all three shapes at the SAME height 3, so the flat view can be compared
   * cell for cell:
   *   x = 3, y = 3..5   a wall; (3,4) is an ARCH,  open at level 0
   *   x = 8, y = 4..6   a wall; (8,5) is a WINDOW, open at level 1
   *   x = 10, y = 5     a plain SOLID column, the blocker
   *   x = 2 / 4, y = 8   a lone ARCH and a lone SOLID column of the same height, side by side and clear of the beam
   * The beam does all three things in one run: it passes UNDER the arch at level 0, a WEDGE lifts it and a DIP
   * levels it at 1, it THREADS the window, and it is stopped by the solid column short of the target. The trace is
   * the engine's own (LaserSim.trace), so the renderer is drawing exactly what the stepper of 13.2 produces.
   */
  var ARCH = (function () {
    var n = 12, rows = [], x, y, row;
    for (y = 0; y < n; y++) {
      row = '';
      for (x = 0; x < n; x++) {
        var h = 0;
        if (x === 3 && y >= 3 && y <= 5) h = 3;          /* the arch wall */
        if (x === 8 && y >= 4 && y <= 6) h = 3;          /* the window wall */
        if (x === 10 && y === 5) h = 3;                  /* the solid blocker, same height as both */
        if (x === 6 && y === 5) h = 1;                   /* the DIP's pedestal */
        /* a lone ARCH and a lone SOLID column of the same height, side by side and well clear of the beam: the
         * pair the FLAT view is judged on, by eye and by the pixel diff */
        if (x === 2 && y === 8) h = 3;
        if (x === 4 && y === 8) h = 3;
        if (x === 9 && y === 10) h = 1;                  /* a little scenery, so the board is not just the demo */
        row += String(h);
      }
      rows.push(row);
    }
    return {
      raw: {
        name: 'ARCH+WINDOW', par: 2, size: { w: n, d: n }, terrain: rows,
        openings: [{ x: 3, y: 4, levels: [0] }, { x: 8, y: 5, levels: [1] }, { x: 2, y: 8, levels: [0] }],
        emitter: { x: 0, y: 4, dir: 'E' },
        targets: [{ x: 11, y: 5 }],
        fixed: [], tray: ['MIRROR', 'WEDGE', 'DIP']
      },
      placed: [{ x: 6, y: 4, type: 'WEDGE', orient: '/' }, { x: 6, y: 5, type: 'DIP', orient: '/' }]
    };
  }());
  /* The arch board's own trace, reused by the `archSolid` control below. The control must draw the IDENTICAL beam,
   * or the FLAT pixel diff would be measuring a different beam path rather than the openings. */
  function archResult() { return LaserSim.trace(LaserSim.parseLevel(ARCH.raw), ARCH.placed); }
  /* the same level with its `openings` removed: the control every "does the hole show?" measurement is made against */
  function stripOpenings(raw) { var k, c = {}; if (!raw) return null; for (k in raw) if (k !== 'openings') c[k] = raw[k]; return c; }
  /* A shipped level, or the demo board if the level set has moved under us (this is a dev tool, not a test fixture). */
  function shipped(i) { var L = (self.LASER_LEVELS || [])[i]; return L ? { raw: L, placed: [] } : ARCH; }
  function shippedSolid(i) { var L = stripOpenings((self.LASER_LEVELS || [])[i]); return L ? { raw: L, placed: [] } : ARCH; }

  var LEVELS = {
    small: {
      raw: {
        name: 'HARNESS', par: 1, size: { w: 7, d: 7 },
        terrain: ['0000000', '0000100', '0002220', '0000000', '0000030', '2002000', '1100010'],
        emitter: { x: 0, y: 3, dir: 'E' },
        targets: [{ x: 0, y: 5 }],
        fixed: [{ x: 3, y: 3, type: 'WEDGE', orient: '/', secret: true }],
        tray: ['MIRROR', 'WEDGE', 'DIP']
      },
      placed: [{ x: 5, y: 1, type: 'DIP', orient: '\\' }, { x: 3, y: 5, type: 'MIRROR', orient: '\\' }]
    },
    big20: bigLevel(20),
    big24: bigLevel(24),
    /* the same 24x24 board with an opening punched into every column tall enough to take one: the worst case for
     * the per-voxel geometry of 13.5, used to prove the draw calls and the frame time have not regressed */
    big24open: (function () {
      var L = bigLevel(24), o = [], x, y;
      for (y = 0; y < 24; y++) for (x = 0; x < 24; x++) {
        var h = L.raw.terrain[y].charCodeAt(x) - 48;
        if (h >= 2) o.push({ x: x, y: y, levels: [(x + y) % 2 === 0 ? 0 : h - 2] });
      }
      return { raw: { name: '24x24 open', par: L.raw.par, size: L.raw.size, terrain: L.raw.terrain, openings: o,
        emitter: L.raw.emitter, targets: L.raw.targets, fixed: L.raw.fixed, tray: L.raw.tray }, placed: L.placed };
    }()),
    arch: ARCH,
    /* ---- DARKNESS (DESIGN.md 15) ---------------------------------------------------------------------------
     * The same arch board with `dark: true`. It is the right board for the fog because it already carries every
     * shape darkness has to hide - tall walls, an arch, a window, a light leak and two placed pieces - so the
     * "unknown draws nothing / known draws exactly the lit board" pair can be diffed cell for cell against `arch`
     * itself, which is the identical level with the fog off. */
    dark: { raw: (function () { var r = ARCH.raw, k, c = {}; for (k in r) c[k] = r[k]; c.name = 'DARK'; c.dark = true; return c; }()),
      placed: ARCH.placed },
    /* the shipped levels that actually use the shapes, so the tilted reveal can be judged on real content and not
     * only on the demo board. Indexes, not names: the level set is regenerated and the names may move. */
    real10: shipped(9), real14: shipped(13),
    real10solid: shippedSolid(9), real14solid: shippedSolid(13),
    /* the arch board with the `openings` stripped, drawing the SAME beam: the control for the FLAT pixel-equality
     * proof of DESIGN.md 13.5, so the only thing that can differ between the two frames is the openings themselves */
    archSolid: { raw: (function () { var r = ARCH.raw, k, c = {}; for (k in r) if (k !== 'openings') c[k] = r[k]; return c; }()),
      placed: ARCH.placed, result: archResult },
    /* the 6x6 board James measured (269x269 px flat, 260x195 tilt in a 393x614 canvas) */
    six: {
      raw: {
        name: '6x6', par: 1, size: { w: 6, d: 6 },
        terrain: ['000000', '000000', '001000', '000000', '000200', '000000'],
        emitter: { x: 0, y: 2, dir: 'E' }, targets: [{ x: 4, y: 4 }],
        fixed: [], tray: ['MIRROR']
      },
      placed: [{ x: 4, y: 2, type: 'MIRROR', orient: '/' }]
    }
  };

  var canvas = document.getElementById('board');
  var render = LaserRender.create({ canvas: canvas, theme: LaserTheme, sim: LaserSim });
  var level = null, placed = [], result = null, name = 'small';

  function fit() {
    var w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;
    render.resize(w, h, window.devicePixelRatio || 1);
  }
  /* The cells DESIGN.md 15.1 says a dark level opens with: the emitter's, and every target's. */
  function seedCells(lv) {
    var out = [{ x: lv.emitter.x, y: lv.emitter.y }], i;
    for (i = 0; i < lv.targets.length; i++) out.push({ x: lv.targets[i].x, y: lv.targets[i].y });
    return out;
  }
  function load(which) {
    var L = LEVELS[which] || LEVELS.small;
    name = which;
    level = LaserSim.parseLevel(L.raw);
    placed = L.placed.slice();
    render.setLevel(level);
    /* `dark` may or may not have survived parseLevel yet (the engine owns that flag); read the parsed level first
     * and fall back to the raw one, exactly as main.js does. */
    render.setDarkness({ dark: !!(level.dark || L.raw.dark), known: seedCells(level) });
    render.setPlaced(placed);
    /* A scene may pin its own TraceResult (the archSolid control draws the arch board's beam over solid terrain). */
    result = typeof L.result === 'function' ? L.result() : (L.result || LaserSim.trace(level, placed));
    render.setBeam(result, { animate: false, fired: true });
    render.frame(0.016);
    return { w: level.size.w, d: level.size.d, segments: result.segments.length };
  }
  fit();
  window.addEventListener('resize', fit);
  load('small');
  render.setCameraPreset('flat', { animate: false });

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    render.frame(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* Count every drawable in the scene graph (the renderer's own info.render.calls is measured separately). */
  function sceneObjects() {
    var n = 0;
    render._scene.traverse(function () { n++; });
    return n;
  }
  /* Frame time over `frames` synchronous render.frame() calls, with a gl.finish() at the end so the GPU work is
   * included rather than just the submission cost. The rAF loop keeps running around it. */
  function frameTime(frames) {
    var i, t0, gl = render._renderer.getContext();
    for (i = 0; i < 10; i++) render.frame(0.016);          /* warm up shaders / uploads */
    gl.finish();
    t0 = performance.now();
    for (i = 0; i < frames; i++) render.frame(0.016);
    gl.finish();
    return (performance.now() - t0) / frames;
  }
  function settle(ms) { var i, n = Math.ceil((ms || 600) / 16); for (i = 0; i < n; i++) render.frame(0.016); }

  /* Reference picker: the per-cell invisible-box raycast the renderer used BEFORE the analytic version, kept here
   * (test-only, never in the scene) as independent ground truth for render.pickCell. */
  var refGroup = null, refRay = new THREE.Raycaster(), refFor = null;
  function refBuild() {
    if (refFor === level) return;
    refFor = level;
    if (refGroup) { refGroup.traverse(function (o) { if (o.geometry) o.geometry.dispose(); }); }
    refGroup = new THREE.Group();
    var mat = new THREE.MeshBasicMaterial({ visible: false }), cell = LaserTheme.terrain.cellTop, x, y, h;
    for (y = 0; y < level.size.d; y++) for (x = 0; x < level.size.w; x++) {
      h = level.t[y][x];
      var g = new THREE.BoxGeometry(cell, h + 0.05, cell);
      g.translate(x, (h + 0.05) / 2 - 0.05, -y);
      var m = new THREE.Mesh(g, mat);
      m.userData.cell = { x: x, y: y };
      refGroup.add(m);
    }
    refGroup.updateMatrixWorld(true);
  }
  function refPick(clientX, clientY) {
    refBuild();
    var rect = render._renderer.domElement.getBoundingClientRect();
    var nx = ((clientX - rect.left) / rect.width) * 2 - 1, ny = -((clientY - rect.top) / rect.height) * 2 + 1;
    refRay.setFromCamera(new THREE.Vector2(nx, ny), render._camera);
    var hits = refRay.intersectObjects(refGroup.children, false);
    return hits.length ? { x: hits[0].object.userData.cell.x, y: hits[0].object.userData.cell.y } : null;
  }

  /* The PREVIOUS fit rule (theme.camera.presets[*].paddingCells / minPaddingCells / fitHeights), reimplemented here
   * for the before/after measurement only. Nothing in src/ reads those tokens any more. */
  function legacyFitZoom(presetName) {
    var P = LaserTheme.camera.presets[presetName], DEG = Math.PI / 180;
    var a = P.azimuthDeg * DEG, e = P.elevationDeg * DEG;
    var dir = new THREE.Vector3(Math.cos(e) * Math.sin(a), Math.sin(e), Math.cos(e) * Math.cos(a));
    var up = new THREE.Vector3(-Math.sin(e) * Math.sin(a), Math.cos(e), -Math.sin(e) * Math.cos(a));
    var right = new THREE.Vector3().crossVectors(dir.clone().negate(), up).normalize();
    var w = level.size.w, d = level.size.d, cx = (w - 1) / 2, cz = -(d - 1) / 2, hw = 0, hh = 0;
    var W = document.documentElement.clientWidth, H = document.documentElement.clientHeight;
    [-0.5, w - 0.5].forEach(function (x) {
      [-0.5, d - 0.5].forEach(function (y) {
        P.fitHeights.forEach(function (h) {
          var p = new THREE.Vector3(x - cx, h, -y - cz);
          hw = Math.max(hw, Math.abs(p.dot(right))); hh = Math.max(hh, Math.abs(p.dot(up)));
        });
      });
    });
    var pad = P.paddingCells, minPad = P.minPaddingCells, minCell = LaserTheme.camera.minCellPx;
    var z = Math.min(W / (2 * (hw + pad)), H / (2 * (hh + pad)));
    if (typeof minPad === 'number' && minPad < pad && z < minCell) {
      pad = Math.max(minPad, Math.min(pad, Math.min(W / (2 * minCell) - hw, H / (2 * minCell) - hh)));
      z = Math.min(W / (2 * (hw + pad)), H / (2 * (hh + pad)));
    }
    return z;
  }

  /* ---- FLAT pixel equality (DESIGN.md 13.5 / task 2) --------------------------------------------------------
   * The whole feature rests on an opened column being INDISTINGUISHABLE from a solid one in FLAT, so the proof is
   * a whole-framebuffer diff of the same board with and without its `openings`, not a spot check: read every pixel
   * of both, and report where the two differ. The only pixels allowed to differ are the light leak's (13.3), so
   * the diff is reported as "how far is the furthest differing pixel from an opened cell's centre".
   */
  function readPixels() {
    var gl = render._renderer.getContext();
    var w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, buf = new Uint8Array(w * h * 4);
    render.frame(0.016);
    gl.finish();
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    return { w: w, h: h, buf: buf };
  }
  function bufferPoint(cell) {
    var gl = render._renderer.getContext(), rect = render._renderer.domElement.getBoundingClientRect();
    var p = render.projectCell(cell, 0), dpr = render._renderer.getPixelRatio();
    return { x: (p.x - rect.left) * dpr, y: gl.drawingBufferHeight - (p.y - rect.top) * dpr };
  }
  /* Load `a`, snapshot; load `b`, snapshot; diff. `cells` are the cells whose columns carry an opening. */
  function flatDiff(a, b, cells, view) {
    view = view || 'flat';
    load(a); fit(); render.setCameraPreset(view, { animate: false }); settle(900);
    var A = readPixels(), centres = cells.map(bufferPoint);
    load(b); fit(); render.setCameraPreset(view, { animate: false }); settle(900);
    var B = readPixels();
    if (A.w !== B.w || A.h !== B.h) return { error: 'size', a: [A.w, A.h], b: [B.w, B.h] };
    var i, j, n = A.w * A.h, diff = 0, maxDelta = 0, worst = 0, x, y, dx, dy, dist, near;
    var dpr = render._renderer.getPixelRatio(), perCell = cells.map(function () { return 0; });
    var bbox = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
    for (i = 0; i < n; i++) {
      var d0 = Math.abs(A.buf[i * 4] - B.buf[i * 4]), d1 = Math.abs(A.buf[i * 4 + 1] - B.buf[i * 4 + 1]);
      var d2 = Math.abs(A.buf[i * 4 + 2] - B.buf[i * 4 + 2]), d3 = Math.abs(A.buf[i * 4 + 3] - B.buf[i * 4 + 3]);
      var dmax = Math.max(d0, d1, d2, d3);
      if (dmax === 0) continue;
      diff++;
      if (dmax > maxDelta) maxDelta = dmax;
      x = i % A.w; y = (i / A.w) | 0;
      near = 0; dist = Infinity;
      for (j = 0; j < centres.length; j++) {
        dx = x - centres[j].x; dy = y - centres[j].y;
        var dd = Math.sqrt(dx * dx + dy * dy);
        if (dd < dist) { dist = dd; near = j; }
      }
      perCell[near]++;
      if (dist > worst) worst = dist;
      if (x < bbox.x0) bbox.x0 = x; if (x > bbox.x1) bbox.x1 = x;
      if (y < bbox.y0) bbox.y0 = y; if (y > bbox.y1) bbox.y1 = y;
    }
    return { pixels: n, diff: diff, maxDelta: maxDelta, worstDistPx: worst / dpr, perCell: perCell, dpr: dpr,
      cellPx: render.getCellPx(), bbox: bbox, centres: centres.map(function (c) { return { x: Math.round(c.x / dpr), y: Math.round((A.h - c.y) / dpr) }; }) };
  }
  /* ---- DARKNESS (DESIGN.md 15) ------------------------------------------------------------------------------
   * Every cell of the current level, i.e. "the beam has been everywhere". Applied through setDarkness so it lands
   * instantly, with no arrival animation left to settle. */
  function revealAll() {
    var c = [], x, y;
    for (y = 0; y < level.size.d; y++) for (x = 0; x < level.size.w; x++) c.push({ x: x, y: y });
    render.setDarkness({ dark: true, known: c });
  }
  /* Whole-framebuffer diff of two scenes in the same view. `revealB` fully reveals the second one first, which is
   * how 15.1's last rule is proved: a dark board with everything known must be BYTE-IDENTICAL to the lit board,
   * because darkness gates when the player sees a cell and never how it looks. */
  function diffScenes(a, b, view, revealB) {
    view = view || 'flat';
    load(a); fit(); render.setCameraPreset(view, { animate: false }); settle(900);
    var A = readPixels();
    load(b); fit(); render.setCameraPreset(view, { animate: false });
    if (revealB) revealAll();
    settle(900);
    var B = readPixels();
    if (A.w !== B.w || A.h !== B.h) return { error: 'size' };
    var i, n = A.w * A.h, diff = 0, maxDelta = 0, d;
    for (i = 0; i < n; i++) {
      d = Math.max(Math.abs(A.buf[i * 4] - B.buf[i * 4]), Math.abs(A.buf[i * 4 + 1] - B.buf[i * 4 + 1]),
                   Math.abs(A.buf[i * 4 + 2] - B.buf[i * 4 + 2]), Math.abs(A.buf[i * 4 + 3] - B.buf[i * 4 + 3]));
      if (!d) continue;
      diff++;
      if (d > maxDelta) maxDelta = d;
    }
    return { pixels: n, diff: diff, maxDelta: maxDelta, pct: diff / n };
  }
  /* Run the fog's arrival frame by frame and report what it did: the value per frame, how many frames it took, and
   * whether the renderer was still asking for frames at each end. */
  function revealTrace(cell, maxFrames) {
    var out = { before: render._fog.value(cell.x, cell.y), needsBefore: render.needsFrame(), values: [], frames: 0 };
    render.revealCells([cell]);
    out.needsAfterCall = render.needsFrame();
    var i;
    for (i = 0; i < (maxFrames || 200); i++) {
      render.frame(0.016);
      out.frames++;
      out.values.push(+render._fog.value(cell.x, cell.y).toFixed(4));
      if (!render._fog.isAnimating()) break;
    }
    out.after = render._fog.value(cell.x, cell.y);
    out.animatingAfter = render._fog.isAnimating();
    out.needsAfter = render.needsFrame();
    return out;
  }

  /* Byte-exact sample of one cell's top, offset a few CSS px off centre so it never lands on the leak. */
  function sampleCell(cell, offX, offY) {
    var gl = render._renderer.getContext(), p = bufferPoint(cell), dpr = render._renderer.getPixelRatio();
    var buf = new Uint8Array(4);
    render.frame(0.016);
    gl.readPixels(Math.round(p.x + (offX || 0) * dpr), Math.round(p.y + (offY || 0) * dpr), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    return Array.prototype.slice.call(buf, 0, 3);
  }

  window.__h = {
    render: render, sim: LaserSim, theme: LaserTheme,
    name: function () { return name; },
    flatDiff: flatDiff, sampleCell: sampleCell,
    openLevelsAt: function (x, y) { return render.openLevelsAt(x, y); },
    /* the light-leak material's live state, so the test can prove it is a FLAT-only tell */
    leak: function () {
      var mesh = null;
      render._scene.traverse(function (o) { if (o.name === 'terrainLightLeak') mesh = o; });
      var mat = mesh ? mesh.material : null;
      return { mesh: !!mesh, quads: mesh ? mesh.geometry.getAttribute('position').count / 6 : 0,
        opacity: mat ? mat.opacity : 0, visible: !!(mat && mat.visible && mesh.visible),
        color: mat ? '#' + mat.color.getHexString().toUpperCase() : null,
        additive: !!(mat && mat.blending === THREE.AdditiveBlending), renderOrder: mesh ? mesh.renderOrder : null };
    },
    /* the camera's silhouette, as the auto-fit sees it: an opening must not move any of this */
    silhouette: function () {
      var c = render.getCamera(), b = render.getBoardScreenBox();
      return { fitZoom: c.fitZoom, effectiveZoom: c.effectiveZoom, cellPx: c.cellPx,
        box: { w: +b.width.toFixed(4), h: +b.height.toFixed(4), cx: +b.centerX.toFixed(4), cy: +b.centerY.toFixed(4) } };
    },
    /* ---- DARKNESS hooks (DESIGN.md 15) ---- */
    fog: function () {
      var f = render.fogState(), g = render._fog;

    fogAt: function (x, y) { return render._fog.value(x, y); },

    reveal: function (cells) { return render.revealCells(cells); },
    /* Every cell the current trace entered, in the order the beam entered them - the set a FIRE learns (15.1). */
    beamCells: function () {
      var out = [{ x: level.emitter.x, y: level.emitter.y }], v = (result && result.visited) || [], i;
      for (i = 0; i < v.length; i++) out.push({ x: v[i].x, y: v[i].y });
      return out;

    setDark: function (on, known) { render.setDarkness({ dark: on, known: known || seedCells(level) }); },
    load: load, fit: fit, settle: settle, sceneObjects: sceneObjects, frameTime: frameTime, refPick: refPick,
    view: function (n) { return render.setCameraPreset(n, { animate: false }); },
    place: function (p) { placed = p; render.setPlaced(p); result = LaserSim.trace(level, p); render.setBeam(result, { animate: false, fired: true }); return result; },
    fire: function () { render.setBeam(result, { animate: true, fired: true }); },
    /* Fraction of the LIMITING canvas dimension the board's projected box fills (DESIGN.md 11.2).

     * bounding-box auto-fit that task 1 is measured on. */
    fitPct: function () {
      var b = render.getBoardScreenBox(), c = render.getCamera();
      var w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;

      return { pct: Math.max(b.width / w, b.height / h), fitPct: Math.max(b.width * k / w, b.height * k / h),
        box: b, canvas: { w: w, h: h } };
    },
    /* Same board box, measured under the OLD padding-based fit: the before number. */
    legacyFitPct: function (presetName) {
      var b = render.getBoardScreenBox(), c = render.getCamera(), lz = legacyFitZoom(presetName);
      var w = document.documentElement.clientWidth, h = document.documentElement.clientHeight;

  Object.defineProperty(window.__h, 'level', { get: function () { return level; } });
  Object.defineProperty(window.__h, 'placed', { get: function () { return placed; } });
  Object.defineProperty(window.__h, 'result', { get: function () { return result; } });
}());
