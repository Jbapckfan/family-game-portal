<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0c"><title>LOADBEARING</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080a0c;color:#eee;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center;overflow:hidden}.loader{width:min(560px,90vw);padding:30px;border:1px solid #5a4520;background:linear-gradient(180deg,#15191d,#090b0d);box-shadow:0 30px 80px #000;text-align:center}h1{margin:0;font:900 clamp(44px,12vw,78px)/.9 Impact,"Arial Narrow",sans-serif;letter-spacing:.02em;color:#e5e0d6;text-shadow:0 4px 0 #282828}p{color:#a8aaab;font-size:12px;letter-spacing:.08em}.track{height:10px;margin:24px 0 12px;background:#030405;border:1px solid #3b3d3e;overflow:hidden}.bar{height:100%;width:8%;background:linear-gradient(90deg,#bd7511,#f1b625);box-shadow:0 0 18px #edaa20;transition:width .14s}.status{font-size:10px;font-weight:800;letter-spacing:.14em;color:#eab335}button{display:none;margin:20px auto 0;padding:12px 18px;border:1px solid #e5aa15;background:#17120a;color:#f0c24b;font-weight:900;cursor:pointer}.error button{display:block}.error .status{color:#ff7a64}</style></head><body><div class="loader" id="loader"><h1>LOADBEARING</h1><p>STRUCTURAL PHYSICS SYSTEM</p><div class="track"><div class="bar" id="bar"></div></div><div class="status" id="status">LOADING FRAME DATA…</div><button onclick="location.reload()">RETRY LAUNCH</button></div><script>(async()=>{const f=['payload-0.txt?v=be2967d63be7','payload-1.txt?v=be2967d63be7','payload-2.txt?v=be2967d63be7','payload-3.txt?v=be2967d63be7','payload-4.txt?v=be2967d63be7','payload-5.txt?v=be2967d63be7','payload-6.txt?v=be2967d63be7','payload-7.txt?v=be2967d63be7'],b=document.getElementById('bar'),s=document.getElementById('status'),l=document.getElementById('loader');try{if(!('DecompressionStream'in window))throw new Error('Open in current Safari or Chrome');let p='';for(let i=0;i<f.length;i++){const r=await fetch(f[i],{cache:'no-store'});if(!r.ok)throw new Error('Missing game data '+(i+1));p+=await r.text();b.style.width=Math.round((i+1)/f.length*82)+'%';s.textContent='LOADING PHYSICS '+(i+1)+' / '+f.length}s.textContent='BUILDING STRUCTURAL SOLVER…';b.style.width='91%';const x=Uint8Array.from(atob(p.replace(/\s/g,'')),c=>c.charCodeAt(0));const h=await new Response(new Blob([x]).stream().pipeThrough(new DecompressionStream('gzip'))).text();b.style.width='100%';s.textContent='SYSTEM READY';await new Promise(r=>setTimeout(r,100));document.open();document.write(h);document.close()}catch(e){console.error(e);l.classList.add('error');s.textContent='LAUNCH FAILED — '+e.message}})()</script></body></html>
