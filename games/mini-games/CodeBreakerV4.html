<style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0d0c1d;
            background-image: radial-gradient(circle at center, rgba(14, 1, 36, 0.8) 0%, rgba(0, 0, 0, 1) 100%);
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
        }
        .text-shadow-neon {
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5), 0 0 10px rgba(34, 211, 238, 0.5), 0 0 20px rgba(34, 211, 238, 0.5);
        }
        .peg-shadow-neon {
            box-shadow: inset 0 0 5px rgba(255,255,255,0.3), 0 0 15px rgba(34, 211, 238, 0.6);
        }
        .peg-shadow-neon.active-glow {
            box-shadow: inset 0 0 8px rgba(255,255,255,0.4), 0 0 20px var(--peg-color-glow);
        }
        .feedback-peg-black {
            background-color: #000;
            border: 1px solid #0ff;
            box-shadow: 0 0 5px #0ff;
        }
        .feedback-peg-white {
            background-color: #fff;
            border: 1px solid #eee;
            box-shadow: 0 0 5px #fff;
        }
        .feedback-peg-empty {
            background-color: #2d3748;
            border: 1px solid #1a202c;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .scanline-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 0.1) 1px,
                rgba(0, 0, 0, 0) 2px
            );
            pointer-events: none;
            z-index: 0;
        }
        .win-animation {
            animation: winPulse 1.5s infinite alternate;
        }
        @keyframes winPulse {
            0% { transform: scale(1); text-shadow: 0 0 5px rgba(255, 255, 255, 0.5), 0 0 10px rgba(255, 255, 0, 0.5); }
            100% { transform: scale(1.05); text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 0, 0.8), 0 0 30px rgba(255, 255, 0, 0.6); }
        }

        /* FIX for board shifting on color picker click */
        .color-picker-button {
            min-width: 44px;
            min-height: 44px;
            border: 2px solid #4a5568;
            box-shadow: 0 0 0px transparent;
            transition: transform 0.1s ease-in-out, box-shadow 0.2s ease-out, border-color 0.2s ease-out;
        }
        @media (hover: hover) {
        .color-picker-button:hover {
            transform: scale(1.1);
            border-color: #6b7280;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
}
        .color-picker-button.selected {
            border-color: white;
            box-shadow: 0 0 10px white, 0 0 20px white;
            transform: scale(1.05);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: #1a202c;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.7);
            max-width: 90%;
            max-height: 80%;
            overflow-y: auto;
            position: relative;
            border: 2px solid #00FFFF;
        }
        .modal-close-button {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #00FFFF;
            cursor: pointer;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float 5s infinite linear;
        }
        @keyframes float {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(20px) rotate(360deg);
                opacity: 0;
            }
        }
        .switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            width: 60px;
            height: 44px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 5px;
            left: 0;
            right: 0;
            bottom: 5px;
            background-color: #2d3748;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: #00ffff;
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 0 5px #00ffff;
        }
        input:checked + .slider {
            background-color: #4f46e5;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
            background-color: #8b5cf6;
        }
        .stats-box {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(34, 211, 238, 0.3);
            text-align: center;
        }
        .stats-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #00ffff;
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
        /* Touch target minimums (44px) */
        .touch-target-peg {
            min-width: 44px;
            min-height: 44px;
        }
        select.touch-select {
            min-height: 44px;
            padding: 8px 12px;
        }
        .action-btn {
            min-height: 44px;
        }
        /* Home link hover via CSS instead of inline JS */
        .home-link:focus {
            background: rgba(0,0,0,0.9) !important;
        }
        @media (hover: hover) {
        .home-link:hover {
            background: rgba(0,0,0,0.9) !important;
        }
}
        button:focus-visible, [role="button"]:focus-visible,
        a:focus-visible, select:focus-visible, input:focus-visible,
        [tabindex]:focus-visible {
            outline: 2px solid #00ffff;
            outline-offset: 2px;
        }
        /* Fix 6: Prevent overflow on narrow screens with many pegs (e.g., hard mode) */
        @media (max-width: 360px) {
            .touch-target-peg {
                min-width: 36px;
                min-height: 36px;
            }
            .color-picker-button {
                min-width: 36px;
                min-height: 36px;
            }
        }
        /* Reclaim fixed chrome on short viewports (landscape iPad / small phones)
           so the past-guesses list keeps its minimum height */
        @media (max-height: 750px) {
            .game-title {
                font-size: 1.5rem !important;
                line-height: 2rem !important;
                margin-bottom: 4px !important;
            }
            .stats-box {
                padding: 4px 8px;
            }
            .stats-value {
                font-size: 0.9rem;
            }
            .action-btn {
                font-size: 0.75rem !important;
                padding-left: 8px !important;
                padding-right: 8px !important;
            }
            .secondary-action-btn {
                order: 2;
                min-height: 36px;
                font-size: 0.7rem !important;
                padding-top: 2px !important;
                padding-bottom: 2px !important;
            }
            /* If chrome still doesn't fit (small phones), let the panel scroll
               instead of clipping the action buttons */
            .game-panel {
                overflow-y: auto !important;
            }
        }
        /* === FEATURE: Animated Feedback Reveal === */
        @keyframes feedbackPop {
            0% { transform: scale(0) rotate(180deg); opacity: 0; }
            60% { transform: scale(1.4) rotate(0deg); opacity: 1; }
            80% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        .feedback-peg-animate {
            opacity: 0;
            transform: scale(0);
            animation: feedbackPop 0.4s ease-out forwards;
        }

        /* === FEATURE: Animated Secret Code Reveal === */
        .secret-peg-container {
            perspective: 600px;
        }
        .secret-peg-flipper {
            position: relative;
            width: 40px;
            height: 40px;
            transform-style: preserve-3d;
            transition: transform 0.6s ease-in-out;
        }
        .secret-peg-flipper.flipped {
            transform: rotateY(180deg);
        }
        .secret-peg-front, .secret-peg-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .secret-peg-front {
            background-color: #2d3748;
            border: 2px solid rgba(34, 211, 238, 0.4);
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
            color: #67e8f9;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .secret-peg-back {
            transform: rotateY(180deg);
        }
        @keyframes secretRevealGlow {
            0% { box-shadow: 0 0 5px currentColor; }
            50% { box-shadow: 0 0 20px currentColor, 0 0 40px currentColor; }
            100% { box-shadow: 0 0 10px currentColor; }
        }
        .secret-peg-revealed {
            animation: secretRevealGlow 0.8s ease-out;
        }

        /* === FEATURE: Auto-Advance Active Slot === */
        @keyframes slotPulse {
            0%, 100% { box-shadow: inset 0 0 5px rgba(255,255,255,0.1), 0 0 8px rgba(34, 211, 238, 0.4); }
            50% { box-shadow: inset 0 0 8px rgba(255,255,255,0.3), 0 0 16px rgba(34, 211, 238, 0.8), 0 0 24px rgba(34, 211, 238, 0.4); }
        }
        .active-slot-indicator {
            animation: slotPulse 1.2s ease-in-out infinite;
            border: 2px dashed rgba(34, 211, 238, 0.7) !important;
        }

        /* === FEATURE: Win/Loss History Log === */
        .history-list {
            max-height: 400px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #4a5568 transparent;
        }
        .history-list::-webkit-scrollbar {
            width: 6px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 3px;
        }
        .history-entry {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(34, 211, 238, 0.2);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }
        .history-entry.win-entry {
            border-color: rgba(34, 197, 94, 0.4);
        }
        .history-entry.loss-entry {
            border-color: rgba(239, 68, 68, 0.3);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* === FEATURE 2: Color Elimination Notepad === */
        .notepad-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(34, 211, 238, 0.4);
            border-radius: 8px;
            padding: 6px 10px;
            margin-bottom: 4px;
            transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
            overflow: hidden;
        }
        .notepad-panel.collapsed {
            max-height: 0;
            opacity: 0;
            padding: 0 10px;
            border-color: transparent;
        }
        .notepad-panel.expanded {
            max-height: 200px;
            opacity: 1;
        }
        .notepad-color {
            position: relative;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .notepad-color.eliminated {
            opacity: 0.3;
        }
        .notepad-color.eliminated::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -3px;
            right: -3px;
            height: 3px;
            background: #ff4444;
            transform: rotate(-45deg);
            border-radius: 2px;
            box-shadow: 0 0 6px #ff4444;
        }
        .notepad-toggle-btn {
            font-size: 0.7rem;
            padding: 2px 8px;
            background: rgba(34, 211, 238, 0.15);
            border: 1px solid rgba(34, 211, 238, 0.4);
            color: #67e8f9;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            min-height: 28px;
        }
        @media (hover: hover) {
        .notepad-toggle-btn:hover {
            background: rgba(34, 211, 238, 0.3);
        }
}

        /* === FEATURE 4: Post-Game Summary === */
        .summary-guesses-list {
            max-height: 200px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #4a5568 transparent;
        }
        .summary-guesses-list::-webkit-scrollbar {
            width: 6px;
        }
        .summary-guesses-list::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 3px;
        }
        .copy-result-btn {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            min-height: 44px;
        }
        @media (hover: hover) {
        .copy-result-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }
}
        .copy-result-btn:active {
            transform: scale(0.95);
        }
        .copy-feedback {
            transition: opacity 0.3s;
        }

        /* === FEATURE 5: Animated Tutorial === */
        .tutorial-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .tutorial-card {
            background: linear-gradient(145deg, #1a202c, #0f172a);
            border: 2px solid #00ffff;
            border-radius: 16px;
            padding: 24px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
            position: relative;
        }
        .tutorial-step-indicator {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 16px;
        }
        .tutorial-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2d3748;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .tutorial-dot.active {
            background: #00ffff;
            box-shadow: 0 0 8px #00ffff;
        }
        .tutorial-dot.completed {
            background: #06b6d4;
        }
        .tutorial-anim-board {
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid rgba(34, 211, 238, 0.2);
        }
        @keyframes tutorialPegPlace {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes tutorialPegBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes tutorialFeedbackReveal {
            0% { transform: scale(0) rotate(180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .tut-peg-anim {
            animation: tutorialPegPlace 0.4s ease-out forwards;
        }
        .tut-peg-bounce {
            animation: tutorialPegBounce 0.5s ease-in-out;
