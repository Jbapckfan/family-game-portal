                        return;
                    }
                    newGuess[emptyIndex] = color;
                    dispatch({ type: 'UPDATE_CURRENT_GUESS', newGuess });
                    dispatch({ type: 'SET_SELECTED_COLOR', color: null });
                    AudioSystem.play(520);
                } else {
                    dispatch({ type: 'SET_SELECTED_COLOR', color });
                    AudioSystem.play(440);
                }
            };

            // Handle clicking on a peg in the current guess area
            const handleGuessPegClick = (index) => {
                if (gameStatus !== 'playing') return;

                const newGuess = [...currentGuess];

                if (newGuess[index] !== null) {
                    newGuess[index] = null;
                    dispatch({ type: 'UPDATE_CURRENT_GUESS', newGuess });
                    dispatch({ type: 'SET_SELECTED_COLOR', color: null });
                    AudioSystem.play(520);
                } else {
                    if (selectedColorFromPalette !== null) {
                        if (!allowDuplicates && newGuess.includes(selectedColorFromPalette)) {
                            dispatch({ type: 'SET_MESSAGE', message: 'Colors must be unique in your guess!' });
                            return;
                        }
                        newGuess[index] = selectedColorFromPalette;
                        dispatch({ type: 'UPDATE_CURRENT_GUESS', newGuess });
                        dispatch({ type: 'SET_SELECTED_COLOR', color: null });
                        AudioSystem.play(520);
                    } else {
                        dispatch({ type: 'SET_MESSAGE', message: 'Select a color from the palette first!' });
                        return;
                    }
                }
            };

            // Submit the current guess for feedback
            const handleSubmitGuess = () => {
                if (gameStatus !== 'playing') return;

                if (currentGuess.includes(null)) {
                    dispatch({ type: 'SET_MESSAGE', message: 'Please complete your guess!' });
                    return;
                }
                dispatch({ type: 'SUBMIT_GUESS' });
            };

            // Reset the game to its initial state
            const handleNewGame = () => {
                if (specialMode === 'daily') {
                    dispatch({ type: 'RESET_WITH_SECRET', preset: 'medium', secretCode: seededDailySecret(), disableHints: true, message: `Daily Code ${new Date().toISOString().slice(0,10)} — same puzzle for everyone` });
                    return;
                }
                if (specialMode.startsWith('maker')) {
                    setSpecialMode('maker'); setMakerDraft([]);
                    dispatch({ type: 'SET_MESSAGE', message: 'Code Maker: choose 4 colors, then lock the secret.' });
                    return;
                }
                dispatch({ type: 'RESET_GAME', preset: currentPreset, allowDuplicates: allowDuplicates });
            };

            const handleToggleDuplicates = () => {
                if (guesses.length > 0 || gameStatus !== 'playing') return;
                dispatch({ type: 'RESET_GAME', preset: currentPreset, allowDuplicates: !allowDuplicates });
            };

            const seededDailySecret = () => {
                const day = new Date().toISOString().slice(0, 10);
                let seed = [...day].reduce((n, ch) => ((n * 31) + ch.charCodeAt(0)) >>> 0, 2166136261);
                const colors = GAME_PRESETS.medium.availableColors;
                const result = [];
                for (let i = 0; i < GAME_PRESETS.medium.codeLength; i++) {
                    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
                    result.push(colors[seed % colors.length]);
                }
                return result;
            };

            const startDaily = () => {
                setSpecialMode('daily'); setMakerDraft([]); setNotebookMarks({});
                dispatch({ type: 'RESET_WITH_SECRET', preset: 'medium', secretCode: seededDailySecret(), disableHints: true, message: `Daily Code ${new Date().toISOString().slice(0,10)} — same puzzle for everyone` });
            };

            const startCodeMaker = () => {
                setSpecialMode('maker'); setMakerDraft([]); setNotebookMarks({});
                dispatch({ type: 'SET_MESSAGE', message: 'Code Maker: choose 4 colors, then lock the secret.' });
            };

            const lockMakerCode = () => {
                if (makerDraft.length !== GAME_PRESETS.medium.codeLength) return;
                dispatch({ type: 'RESET_WITH_SECRET', preset: 'medium', secretCode: makerDraft, disableHints: true, message: 'Code locked. Pass the device to the Code Breaker!' });
                setMakerDraft([]); setSpecialMode('maker-playing');
            };

            const cycleNotebookMark = (color) => {
                const order = ['possible', 'impossible', 'confirmed'];
                setNotebookMarks(prev => {
                    const current = prev[color] || (eliminatedColors.includes(color) ? 'impossible' : 'possible');
                    return { ...prev, [color]: order[(order.indexOf(current) + 1) % order.length] };
                });
            };

            // Format time for display
            const formatTime = (seconds) => {
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = seconds % 60;
                return `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
            };

            // Feature 3: Can undo?
            const canUndo = !undoUsed && undoSnapshot !== null && gameStatus === 'playing';

            return (
                <main className="mini-shell h-screen h-[100dvh] relative bg-gray-900 text-white flex flex-col items-center p-2 pt-14 overflow-hidden" role="main">
                    {/* Scanline and particle effects */}
                    <div className="scanline-overlay" aria-hidden="true"></div>
                    {/* Ambient lighting is static; no floating idle particles. */}

                    {/* Feature 5: Animated Tutorial */}
                    {showTutorial && (
                        <TutorialOverlay
                            onClose={() => dispatch({ type: 'SHOW_TUTORIAL', show: false })}
                            availableColors={gameConfig.availableColors}
                            codeLength={gameConfig.codeLength}
                        />
                    )}

                    <div className="breaker-layout game-panel relative z-10 bg-black/60 rounded-xl shadow-2xl p-4 w-full max-w-md border border-blue-700/50 shadow-blue-900/40 flex flex-col flex-1 min-h-0 overflow-hidden">
                        <aside className="breaker-setup"><h1 className="game-title text-3xl md:text-4xl font-bold text-center mb-2 bg-gradient-to-r from-cyan-400 via-blue-400 to-purple-400 bg-clip-text text-transparent tracking-wider text-shadow-neon">
                            NEON BREAKER
                        </h1>

                        {/* Game stats and timer */}
                        <div className="flex justify-between items-center mb-2">
                            <div className="stats-box">
                                <div className="text-sm text-cyan-300">Time</div>
                                <div className="stats-value">{formatTime(elapsedTime)}</div>
                            </div>

                            <div className="stats-box">
                                <div className="text-sm text-cyan-300">Attempts</div>
                                <div className="stats-value">{guesses.length}/{gameConfig.maxGuesses}</div>
                            </div>

                            <div className="stats-box">
                                <div className="text-sm text-cyan-300">Hints</div>
                                <div className="stats-value">{hintsRemaining}</div>
                            </div>
                        </div>

                        {/* Game mode and difficulty toggle */}
                        <div className="flex justify-center gap-2 mb-2 flex-wrap">
                            <button onClick={() => { setSpecialMode('classic'); setMakerDraft([]); setNotebookMarks({}); dispatch({ type: 'RESET_GAME', preset: currentPreset, allowDuplicates }); }} className={`px-2 py-1 rounded border ${specialMode === 'classic' ? 'bg-cyan-700 border-cyan-300' : 'bg-gray-800 border-gray-600'}`}>Classic</button>
                            <button onClick={startDaily} className={`px-2 py-1 rounded border ${specialMode === 'daily' ? 'bg-cyan-700 border-cyan-300' : 'bg-gray-800 border-gray-600'}`}>Daily Code</button>
                            <button onClick={startCodeMaker} className={`px-2 py-1 rounded border ${specialMode.startsWith('maker') ? 'bg-purple-700 border-purple-300' : 'bg-gray-800 border-gray-600'}`}>2P Code Maker</button>
                        </div>
                        {specialMode === 'maker' && <div className="mb-2 p-2 rounded-lg bg-purple-950/80 border border-purple-500">
                            <p className="text-xs text-center text-purple-200 mb-2">Maker only: tap four colors. Duplicates are allowed.</p>
                            <div className="flex justify-center gap-2 mb-2">{makerDraft.map((color, i) => <button key={i} onClick={() => setMakerDraft(d => d.filter((_, j) => j !== i))} className="material-palette-peg w-8 h-8 rounded-full border-2 border-white" style={{backgroundColor: color}} aria-label="Remove maker color"><PegMaterial index={pegMaterialIndex(color)}/></button>)}</div>
                            <div className="flex justify-center gap-2">{GAME_PRESETS.medium.availableColors.map(color => <button key={color} onClick={() => makerDraft.length < 4 && setMakerDraft(d => [...d, color])} className="material-palette-peg w-8 h-8 rounded-full" style={{backgroundColor: color}} aria-label={`Add ${COLOR_NAMES[color]}`}><PegMaterial index={pegMaterialIndex(color)}/></button>)}</div>
                            <button onClick={lockMakerCode} disabled={makerDraft.length !== 4} className="mt-2 w-full py-2 rounded bg-purple-600 font-bold disabled:opacity-40">Lock Secret &amp; Pass Device</button>
                        </div>}
                        <div className="breaker-config">
                            <label className="breaker-difficulty"><span>Difficulty</span><select
                                className="bg-gray-800 text-white rounded p-1 touch-select"
                                value={currentPreset}
                                onChange={(e) => dispatch({ type: 'SET_DIFFICULTY', preset: e.target.value })}
                                disabled={gameStatus !== 'playing' || guesses.length > 0 || specialMode !== 'classic'}
                                aria-label="Select difficulty level"
                             >
                                 {Object.keys(GAME_PRESETS).map(presetKey => (
                                     <option key={presetKey} value={presetKey}>
                                         {presetKey.charAt(0).toUpperCase() + presetKey.slice(1)}
                                     </option>
                                 ))}
                             </select></label>
                            <div className="breaker-duplicates"><span>Duplicates</span><label className="switch">
                                <input
                                    type="checkbox"
                                    checked={allowDuplicates}
                                    onChange={handleToggleDuplicates}
                                    disabled={gameStatus !== 'playing' || guesses.length > 0 || specialMode !== 'classic'}
                                    aria-label="Toggle duplicate colors"
                                />
                                <span className="slider"></span>
                            </label><span>{allowDuplicates ? "On" : "Off"}</span></div>
                        </div>

                        <p className="text-center text-cyan-300/80 mb-1 text-sm text-shadow-neon" role="status" aria-live="polite" aria-atomic="true">
                            {comboMessage && comboMessage !== message && <span className="text-yellow-300 mr-2">{comboMessage}</span>}
                            {message}
                        </p>

                        </aside>
                        {/* Past Guesses and Feedback */}
                        <div ref={guessListRef} className="breaker-history flex-1 min-h-[140px] overflow-y-auto mb-2 p-1 rounded-md bg-gray-700/30 border border-gray-600/30" role="list" aria-label="Past guesses and feedback">
                            {guesses.map((g, index) => (
                                <GuessRow key={index} guess={g.code} feedback={g.feedback} codeLength={gameConfig.codeLength} rowNumber={index + 1} isLatest={index === guesses.length - 1} />
                            ))}
                        </div>

                        <section className="breaker-input">
                        {/* Current Guess Input */}
                        {(() => {
                            const nextEmptySlot = gameStatus === 'playing' ? currentGuess.indexOf(null) : -1;
                            return (
                                <div ref={guessInputRef} className="flex flex-wrap justify-center gap-2 mb-2 p-2 bg-gray-700/50 rounded-lg shadow-inner border border-gray-600/50" aria-label="Current guess input area">
                                    {Array.from({ length: gameConfig.codeLength }).map((_, i) => (
                                        <CodePeg
                                            key={`current-${i}`}
                                            color={currentGuess[i]}
                                            onClick={() => handleGuessPegClick(i)}
                                            index={i}
                                            totalPegs={gameConfig.codeLength}
                                            isActiveSlot={i === nextEmptySlot}
                                        />
                                    ))}
                                </div>
                            );
                        })()}

                        {/* Color Picker */}
                        <div className="flex flex-wrap justify-center gap-2 mb-1" role="group" aria-label="Color selection palette">
                            {gameConfig.availableColors.map(color => (
                                <button
                                    key={color}
                                    onClick={() => handlePaletteColorClick(color)}
                                    className={`material-palette-peg rounded-full transition-transform duration-100 ease-in-out hover:scale-110 active:scale-90 color-picker-button ${selectedColorFromPalette === color ? 'selected' : ''}`}
                                    style={{ backgroundColor: color }}
                                    disabled={gameStatus !== 'playing'}
                                    aria-label={`Select color ${COLOR_NAMES[color] || color}`}
                                    aria-pressed={selectedColorFromPalette === color}
                                ><PegMaterial index={pegMaterialIndex(color)}/></button>
                            ))}
                        </div>

                        {/* Feature 2: Color Elimination Notepad */}
                        <div className="flex justify-center mb-1">
                            <button
                                onClick={() => dispatch({ type: 'TOGGLE_NOTEPAD' })}
                                className="notepad-toggle-btn"
                                aria-expanded={notepadOpen}
                                aria-controls="notepad-panel"
                                aria-label={notepadOpen ? 'Hide color notepad' : 'Show color notepad'}
                            >
                                {notepadOpen ? 'Hide Notepad' : 'Notepad'}
                            </button>
                        </div>
                        <div id="notepad-panel" className={`notepad-panel ${notepadOpen ? 'expanded' : 'collapsed'}`} aria-label="Color elimination notepad">
                            {notepadOpen && (
                                <div>
                                    <p className="text-xs text-cyan-300/70 mb-2 text-center">Tap each color to cycle Possible → Impossible → Confirmed. All-empty feedback auto-marks impossible.</p>
                                    <div className="flex flex-wrap justify-center gap-3">
                                        {gameConfig.availableColors.map(color => {
                                            const mark = notebookMarks[color] || (eliminatedColors.includes(color) ? 'impossible' : 'possible');
                                            const isElim = mark === 'impossible';
                                            const isConfirmed = mark === 'confirmed';
                                            return (
                                                <button
                                                    key={color}
                                                    onClick={() => cycleNotebookMark(color)}
                                                    className={`notepad-color relative flex flex-col items-center gap-1 ${isElim ? 'eliminated' : ''}`}
                                                    aria-label={`${COLOR_NAMES[color] || color}: ${mark}. Click to cycle note.`}
                                                >
                                                    <div
                                                        className="w-8 h-8 rounded-full border-2 transition-all"
                                                        style={{
                                                            backgroundColor: color,
                                                            borderColor: isElim ? '#ff4444' : (isConfirmed ? '#22c55e' : 'rgba(255,255,255,0.2)'),
                                                            boxShadow: isConfirmed ? '0 0 12px #22c55e' : (isElim ? 'none' : `0 0 6px ${color}`)
                                                        }}
                                                    />
                                                    <span className={`text-xs ${isElim ? 'line-through text-red-400' : (isConfirmed ? 'text-green-300 font-bold' : 'text-gray-400')}`}>
                                                        {isConfirmed ? '✓ ' : ''}{COLOR_NAMES[color] || '?'}
                                                    </span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Action Buttons */}
                        <div className="flex flex-wrap justify-center gap-2">
                            <button
                                onClick={() => dispatch({ type: 'USE_HINT' })}
                                disabled={hintsRemaining <= 0 || gameStatus !== 'playing'}
                                className="action-btn py-1.5 px-3 text-sm bg-purple-700 hover:bg-purple-800 text-white font-bold rounded-lg shadow-lg shadow-purple-700/50 transition-all duration-200 transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
                                aria-label={`Use hint. ${hintsRemaining} hints remaining.`}
                            >
                                Hint ({hintsRemaining})
                            </button>

                            <button
                                onClick={() => dispatch({ type: 'SHOW_RULES', show: true })}
                                className="action-btn secondary-action-btn py-1.5 px-3 text-sm bg-yellow-700 hover:bg-yellow-800 text-white font-bold rounded-lg shadow-lg shadow-yellow-700/50 transition-all duration-200 transform hover:scale-105 active:scale-95"
                                aria-label="Show game rules"
                            >
                                Rules
                            </button>

                            {/* Feature 1: Clear Current Guess Button */}
                            <button
                                onClick={() => dispatch({ type: 'CLEAR_CURRENT_GUESS' })}
                                disabled={gameStatus !== 'playing' || currentGuess.every(c => c === null)}
                                className="action-btn py-1.5 px-3 text-sm bg-gray-600 hover:bg-gray-700 text-white font-bold rounded-lg shadow-lg shadow-gray-600/50 transition-all duration-200 transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
                                aria-label="Clear current guess"
                            >
                                Clear
                            </button>

                            <button
                                onClick={handleSubmitGuess}
                                className="action-btn py-1.5 px-3 text-sm bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-lg shadow-lg shadow-blue-700/50 transition-all duration-200 transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
                                disabled={gameStatus !== 'playing' || currentGuess.includes(null)}
                                aria-label="Submit your guess"
                            >
                                Guess
                            </button>

                            {/* Feature 3: Undo Last Guess Button */}
                            <button
                                onClick={() => dispatch({ type: 'UNDO_GUESS' })}
                                disabled={!canUndo}
                                className="action-btn py-1.5 px-3 text-sm bg-red-700 hover:bg-red-800 text-white font-bold rounded-lg shadow-lg shadow-red-700/50 transition-all duration-200 transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
                                aria-label={undoUsed ? 'Undo already used this game' : 'Undo last guess'}
                                title={undoUsed ? 'Undo already used' : 'Undo last guess (once per game)'}
                            >
                                Undo
                            </button>

                            <button
                                onClick={handleNewGame}
                                className="action-btn py-1.5 px-3 text-sm bg-green-700 hover:bg-green-800 text-white font-bold rounded-lg shadow-lg shadow-green-700/50 transition-all duration-200 transform hover:scale-105 active:scale-95"
                                aria-label="Start a new game"
                            >
                                New Game
                            </button>

                            {/* Feature 5: Tutorial button */}
                            <button
                                onClick={() => dispatch({ type: 'SHOW_TUTORIAL', show: true })}
                                className="action-btn secondary-action-btn py-1.5 px-3 text-sm bg-teal-700 hover:bg-teal-800 text-white font-bold rounded-lg shadow-lg shadow-teal-700/50 transition-all duration-200 transform hover:scale-105 active:scale-95"
                                aria-label="Show tutorial"
                            >
                                Tutorial
                            </button>

                            {/* Game History button */}
                            <button
                                onClick={() => dispatch({ type: 'SHOW_HISTORY', show: true })}
                                className="action-btn secondary-action-btn py-1.5 px-3 text-sm bg-indigo-700 hover:bg-indigo-800 text-white font-bold rounded-lg shadow-lg shadow-indigo-700/50 transition-all duration-200 transform hover:scale-105 active:scale-95"
                                aria-label="View game history"
                            >
                                History
                            </button>
                        </div>

                        </section>
                        {/* Feature 4: Post-Game Summary (replaces old win/loss overlays) */}
                        {gameStatus === 'won' && (
                            <PostGameSummary
                                gameStatus={gameStatus}
                                guesses={guesses}
                                secretCode={secretCode}
                                codeLength={gameConfig.codeLength}
                                elapsedTime={elapsedTime}
                                formatTime={formatTime}
                                maxCombo={maxCombo}
                                currentPreset={currentPreset}
                                maxGuesses={gameConfig.maxGuesses}
                                onPlayAgain={handleNewGame}
                                playAgainRef={playAgainRef}
                            />
                        )}

                        {gameStatus === 'lost' && (
                            <PostGameSummary
                                gameStatus={gameStatus}
                                guesses={guesses}
                                secretCode={secretCode}
                                codeLength={gameConfig.codeLength}
                                elapsedTime={elapsedTime}
                                formatTime={formatTime}
                                maxCombo={maxCombo}
                                currentPreset={currentPreset}
                                maxGuesses={gameConfig.maxGuesses}
                                onPlayAgain={handleNewGame}
                                playAgainRef={lossPlayAgainRef}
                            />
                        )}

                        {/* Rules Modal */}
                        {showRules && (
                            <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="rules-heading" ref={rulesModalRef}>
                                <div className="modal-content">
                                    <button ref={rulesCloseRef} onClick={() => dispatch({ type: 'SHOW_RULES', show: false })} className="modal-close-button" aria-label="Close rules">
                                        &times;
                                    </button>
                                    <h2 id="rules-heading" className="text-2xl md:text-3xl font-bold text-cyan-400 mb-4 text-shadow-neon">Game Rules: Code Breaker</h2>
                                    <p className="text-gray-200 mb-4">
                                        Your goal is to guess the secret code, which consists of {gameConfig.codeLength} colors.
                                        You have {gameConfig.maxGuesses} attempts.
                                    </p>

                                    <h3 className="text-xl font-bold text-blue-300 mt-4 mb-2">How to Play:</h3>
                                    <ul className="list-disc list-inside text-gray-200 space-y-2">
                                        <li>
                                            <span className="font-bold">Make a Guess:</span>
                                            <ul className="list-disc list-inside ml-4 mt-1">
                                                <li>Click a color from the palette at the bottom</li>
                                                <li>Then click on any empty circle in your current guess area</li>
                                                <li>To remove a color, click on a filled circle</li>
                                            </ul>
                                        </li>
                                        <li>
                                            <span className="font-bold">Submit Your Guess:</span> Click "Guess" when your current guess is complete
                                        </li>
                                        <li>
                                            <span className="font-bold">Receive Feedback:</span>
                                            <ul className="list-disc list-inside ml-4 mt-1">
                                                <li><span className="feedback-peg-black inline-block w-3 h-3 rounded-full mr-2"></span> Black: Correct color in correct position</li>
                                                <li><span className="feedback-peg-white inline-block w-3 h-3 rounded-full mr-2"></span> White: Correct color in wrong position</li>
                                            </ul>
                                        </li>
                                        <li>
                                            <span className="font-bold">Win or Lose:</span>
                                            <ul className="list-disc list-inside ml-4 mt-1">
                                                <li>Win: Get {gameConfig.codeLength} black pegs</li>
                                                <li>Lose: Run out of guesses</li>
                                            </ul>
                                        </li>
                                        <li>
                                            <span className="font-bold">Hints:</span> Use the hint button to reveal one correct color ({gameConfig.initialHints} per game)
                                        </li>
                                        <li>
                                            <span className="font-bold">Clear:</span> Reset your current guess row to start over
                                        </li>
                                        <li>
                                            <span className="font-bold">Undo:</span> Take back your last submitted guess (once per game)
                                        </li>
                                        <li>
                                            <span className="font-bold">Notepad:</span> Track eliminated colors to narrow down the code
                                        </li>
                                        <li>
                                            <span className="font-bold">Game Mode:</span> Toggle between allowing duplicate colors or requiring unique colors, and select difficulty.
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        )}
                        {/* Game History Modal */}
                        {showHistory && (
                            <GameHistoryModal onClose={() => dispatch({ type: 'SHOW_HISTORY', show: false })} />
                        )}

                        {/* Compact statistics row */}
                        <div className="breaker-records mt-2 flex justify-between text-xs px-1" role="contentinfo" aria-label="Game statistics">
                            <span className="text-cyan-300">Played: <span className="text-white font-bold">{stats.gamesPlayed}</span></span>
                            <span className="text-cyan-300">Wins: <span className="text-white font-bold">{stats.wins}</span></span>
                            <span className="text-cyan-300">Best: <span className="text-white font-bold">{stats.bestTime === Infinity ? '--:--' : formatTime(stats.bestTime)}</span></span>
                            <span className="text-cyan-300">Fewest: <span className="text-white font-bold">{stats.bestAttempts === Infinity ? '--' : stats.bestAttempts}</span></span>
                        </div>
                    </div>
                </main>
            );
        };

        // Render the main component
        ReactDOM.render(<MastermindGame />, document.getElementById('root'));
    </script>
<script>document.addEventListener("visibilitychange",()=>document.documentElement.classList.toggle("mini-hidden",document.hidden));</script>
</body>
</html>
