    <style>
        html, body {
            background-color: #000;
            overscroll-behavior: none;
            touch-action: manipulation;
        }
        button, a {
            touch-action: manipulation;
        }
        body {
            font-family: 'Orbitron', sans-serif;
        }
        .text-shadow-steel {
          text-shadow: 0 0 5px rgba(255, 255, 255, 0.4), 0 0 10px rgba(239, 68, 68, 0.45), 0 0 24px rgba(239, 68, 68, 0.3);
        }
        .scanline-animation {
          background-image: linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0) 50%,
            rgba(0, 0, 0, 0.25) 50%
          );
          background-size: 100% 4px;
        }
        @keyframes fade-in {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
          animation: fade-in 0.4s ease-out forwards;
        }
        @keyframes cell-pop {
          0% { transform: scale(0.75); opacity: 0.4; }
          100% { transform: scale(1); opacity: 1; }
        }
        .cell-reveal {
          animation: cell-pop 0.14s ease-out;
        }
        /* Cells scale to fill the screen (bigger on iPad) but never overflow:
           limited by both available width and available height, capped at 4rem. */
        .ms-cell {
          --ms-cell: clamp(2rem, min(calc((100vw - 80px) / 9), calc((100dvh - 510px) / 9)), 4rem);
          width: var(--ms-cell);
          height: var(--ms-cell);
          font-size: calc(var(--ms-cell) * 0.5);
          line-height: 1;
        }
        @media (orientation: landscape) and (max-height: 850px) {
            .mines-shell { align-items: flex-start !important; overflow-y: auto !important; padding-top: 0 !important; }
            .game-header { padding: 0.4rem 0 !important; }
            .game-header p { margin-top: 0.15rem !important; }
            .game-stats { margin-bottom: 0.45rem !important; }
            .game-footer { display: none !important; }
        }
        button:focus-visible, [role="button"]:focus-visible, a:focus-visible {
            outline: 2px solid #f87171;
            outline-offset: 2px;
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
