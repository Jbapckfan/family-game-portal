        }

        body { font-family:ui-rounded,system-ui,sans-serif; color:#fff; }

        .snow-home { padding:76px 24px 24px; justify-content:safe center; background:radial-gradient(ellipse at 50% 25%,#31537355,transparent 65%); }
        .snow-home > .w-full { max-width:1100px; }
        .snow-home h1 { font-size:clamp(42px,6vw,82px); line-height:.96; }
        .snow-home small { font-size:12px; line-height:1.45; }
        .snow-home .grid button { padding:14px 10px; font-size:14px; }
        .snow-home > div:last-child { color:#c2d4e8; font-size:12px; }
        .snow-hud { padding:14px; }
        .snow-hud button { min-width:44px; }
        .snow-hud p { font-size:12px; }
        .snow-hud p.text-2xl { font-size:24px; }
        .snow-hud .max-\[400px\]\:pt-10 { padding-top:0; }
        @media(min-width:768px) { .snow-home .grid button { min-height:90px; } }
        @media(max-width:600px) {
          .snow-home { padding:76px 16px 18px; }
          .snow-home .grid button { padding:8px 5px; font-size:12px; }
          .snow-home small { font-size:11px; }
          .snow-home .px-7 { padding-left:20px; padding-right:20px; font-size:16px; }
          .snow-hud { padding:10px; }
        }
        @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; } }

        /* Round 2: the winter scene fills every axis; the authored field keeps one uniform scale. */
        .snow-shell { background:#0c233c; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
        .snow-stage.is-playing { width:100%; height:100%; max-height:none; aspect-ratio:auto; border:0; background:linear-gradient(#071a2c22,#07121f33),url('snowman-siege/winter-panorama.jpg') center/cover; box-shadow:none; }
        .snow-canvas { display:block; background:transparent; object-fit:fill; }
        .snow-home { background:linear-gradient(#0a182be8,#0a182bf2),url('snowman-siege/winter-panorama.jpg') center/cover; }
        .snow-home small,.snow-home .text-xs,.snow-home > div:last-child { font-size:14px; color:#d5e4f4; line-height:1.4; }
        .snow-home .grid button { border-radius:14px; font-size:14px; background-color:#172d43; border-color:#678299; box-shadow:inset 0 1px #e6faff22,0 3px 0 #020b1666; transition:transform .18s ease,border-color .18s ease,background .18s ease; }
        .snow-home button:disabled { opacity:1; color:#bbcede; background:#142339; border-color:#465b70; }
        .snow-home button:active:not(:disabled),.shop-item:active { transform:translateY(2px); }
        .snow-home .grid button small { color:#d5e4f4; }
        .snow-hud { padding:76px 16px max(16px,env(safe-area-inset-bottom)); }
        .snow-topbar { padding:12px 14px; align-items:center; background:#0b1c30ed; border:1px solid #7d9eb766; border-radius:16px; box-shadow:inset 0 1px #dffaff1a,0 8px 24px #0004; }
        .snow-topbar > div { display:grid; grid-template-columns:auto auto; align-items:baseline; column-gap:12px; }
        .snow-topbar > div > p:last-child { grid-column:1/-1; }
        .snow-hud p,.snow-hud .text-sm,.snow-hud .text-\[9px\],.snow-hud .text-\[10px\] { font-size:14px; color:#e4eef9; }
        .snow-hud p.text-2xl { font-size:28px; font-weight:700; }
        .snow-objective { position:absolute; top:174px; left:16px; right:16px; max-width:760px; margin:0 auto; padding:10px 14px; border:1px solid #93c4de55; border-radius:14px; background:#0d2238ed; transform:none; }
        .snow-objective p { font-size:14px; line-height:1.45; }
        .snow-objective p:first-child { color:#b6f2ff; }
        .snow-footer { gap:10px; background:#0d2238ed; padding:12px 14px; border:1px solid #93c4de55; border-radius:16px; }
        .snow-footer .text-white\/40 { color:#e4eef9; }
        .snow-footer .text-2xl { font-size:28px; }
        .snow-hud .max-\[400px\]\:pt-10 { padding-top:0; }
        @media(max-width:600px) {
          .snow-hud { padding:76px 12px 12px; }
          .snow-objective { top:174px; left:12px; right:12px; }
          .snow-home .grid button,.snow-home small { font-size:14px; }
        }

        /* HUD panels sit outside the uniformly scaled action rectangle. */
        .snow-topbar { position:absolute; top:12px; left:112px; right:12px; min-height:64px; padding:8px 12px; }
        .snow-objective { top:104px; }
        .snow-footer { position:absolute; bottom:max(12px,env(safe-area-inset-bottom)); left:12px; right:12px; }
        .snow-footer > .justify-between { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:12px; }
        .snow-footer > .justify-between > div:first-child { min-width:0; }
        @media(min-width:1000px) and (orientation:landscape) {
          .snow-topbar,.snow-objective,.snow-footer { left:24px; right:auto; width:calc((100vw - 75dvh) / 2 - 48px); max-width:none; margin:0; }
          .snow-topbar { top:76px; }
          .snow-objective { top:210px; }
          .snow-footer { bottom:24px; }
        }
    </style>
</head>
<body>
    <a href="../" class="back-btn">&#x1F3E0; Menu</a>
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ===== CONSTANTS =====
    const GAME_WIDTH = 600;
    const GAME_HEIGHT = 800;
    let DPR = Math.min(window.devicePixelRatio || 1, 2);
    const BASE_MAX_HP = 5;
    const BASE_MAX_AMMO = 40;
    const BASE_FIRE_RATE = 1000 / 12;
    const BASE_RELOAD_TIME = 1200;
    const WAVE_INTERVAL = 15000;
    const DANGER_LINE_Y = 720;
    const BASE_DAMAGE = 1;

    const ENEMY_STATS = {
        BASIC:   { hp: 3, speed: 1.2, points: 100, radius: 25 },
        CHUNKY:  { hp: 8, speed: 0.6, points: 250, radius: 40 },
        THROWER: { hp: 4, speed: 1.0, points: 200, radius: 22 },
        BOSS:    { hp: 85, speed: 0.45, points: 2500, radius: 58 }
    };

    const COLORS = {
        SKY_TOP: '#2c3e50',
        SKY_BOTTOM: '#34495e',
        SNOW: '#ecf0f1',
        SNOW_SHADOW: '#bdc3c7',
        AMMO: '#f1c40f',
        PLAYER_PROJECTILE: '#ffffff',
        ENEMY_PROJECTILE: '#e74c3c',
        DANGER: '#e74c3c'
    };

    const EnemyType = { BASIC: 'BASIC', CHUNKY: 'CHUNKY', THROWER: 'THROWER', BOSS: 'BOSS' };
    const Screen = { HOME: 'HOME', GAME: 'GAME', GAMEOVER: 'GAMEOVER', SHOP: 'SHOP' };

    const LAUNCHERS = {
        rapid: { name:'Rapid Snow', icon:'❄️', desc:'Fast, light snowballs', rate:.55, damage:.75, speed:22, radius:5 },
        cannon: { name:'Ice Cannon', icon:'💣', desc:'Slow splash blasts', rate:2.35, damage:2.4, speed:15, radius:11, splash:75 },
        ricochet: { name:'Ricochet Ice', icon:'💠', desc:'Bank shots off walls', rate:1.15, damage:1.05, speed:21, radius:7, bounces:3 },
        homing: { name:'Homing Flakes', icon:'✨', desc:'Tracks the nearest threat', rate:1.45, damage:1.2, speed:17, radius:6, homing:true }
    };

    const WINTER_BIOMES = [
        { name:'Pinecone Village', icon:'🏘️', goalWave:5, objective:'Defeat 20 invaders', check:s=>s.totalEnemiesKilled>=20, skyTop:'#1d3557', skyBottom:'#457b9d' },
        { name:'Whispering Forest', icon:'🌲', goalWave:7, objective:'Build a 10-hit combo', check:s=>s.highestCombo>=10, skyTop:'#102a2a', skyBottom:'#24544b' },
        { name:'Glacier Pass', icon:'🏔️', goalWave:9, objective:'Finish with 35% accuracy', check:s=>s.totalShotsFired>0&&s.totalShotsHit/s.totalShotsFired>=.35, skyTop:'#16324f', skyBottom:'#1f7a8c' },
        { name:'Aurora Fortress', icon:'🌌', goalWave:12, objective:'Defeat the wave-10 boss and survive', check:s=>s.bossesDefeated>=2, skyTop:'#160f35', skyBottom:'#4c1d6f' }
    ];

    // ===== POWER-UP TYPES =====
    const PowerUpType = {
        HEALTH:      'HEALTH',
        RAPID_FIRE:  'RAPID_FIRE',
        SPREAD_SHOT: 'SPREAD_SHOT',
        FREEZE_BOMB: 'FREEZE_BOMB'
    };

    const POWER_UP_CONFIG = {
        [PowerUpType.HEALTH]:      { color: '#2ecc71', symbol: 'heart',     label: '+HP',        duration: 0 },
        [PowerUpType.RAPID_FIRE]:  { color: '#f1c40f', symbol: 'bolt',      label: 'RAPID FIRE', duration: 5000 },
        [PowerUpType.SPREAD_SHOT]: { color: '#3498db', symbol: 'triple',    label: 'SPREAD',     duration: 5000 },
        [PowerUpType.FREEZE_BOMB]: { color: '#00d2d3', symbol: 'snowflake', label: 'FREEZE',     duration: 3000 }
    };

    const POWER_UP_DROP_CHANCE = 0.15;
    const POWER_UP_FALL_SPEED = 1.5;

    // ===== COMBO THRESHOLDS =====
    const COMBO_TIERS = [
        { hits: 20, multiplier: 4 },
        { hits: 12, multiplier: 3 },
        { hits: 5,  multiplier: 2 },
        { hits: 0,  multiplier: 1 }
    ];

    // ===== THEMED WAVE DEFINITIONS =====
    const THEMED_WAVES = {
        5:  { name: 'CHUNKY RUSH',   subtext: 'Heavy hitters incoming!', spawnBias: { CHUNKY: 0.7, BASIC: 0.2, THROWER: 0.1 } },
        8:  { name: 'SNOWBALL STORM', subtext: 'Dodge the barrage!',     spawnBias: { THROWER: 0.6, BASIC: 0.3, CHUNKY: 0.1 } },
        10: { name: 'FROZEN FURY',    subtext: 'Everything at once!',    spawnBias: { BASIC: 0.33, CHUNKY: 0.34, THROWER: 0.33 } },
        15: { name: 'MEGA RUSH',      subtext: 'Survive the onslaught!', spawnBias: { CHUNKY: 0.5, THROWER: 0.4, BASIC: 0.1 } }
    };

    // ===== UPGRADE SHOP DEFINITIONS =====
    const UPGRADE_DEFS = {
        maxHp:        { name: 'Thick Walls',        desc: '+1 Max HP',             baseCost: 50,  costMult: 1.8, maxLevel: 5,  icon: '&#x2764;' },
        maxAmmo:      { name: 'Ammo Belt',           desc: '+5 Ammo Capacity',      baseCost: 40,  costMult: 1.5, maxLevel: 6,  icon: '&#x1F4E6;' },
        reloadSpeed:  { name: 'Quick Loader',        desc: '-15% Reload Time',      baseCost: 60,  costMult: 2.0, maxLevel: 4,  icon: '&#x26A1;' },
        startWave:    { name: 'Wave Skip',           desc: 'Start at higher wave',  baseCost: 100, costMult: 2.5, maxLevel: 5,  icon: '&#x23E9;' },
        damage:       { name: 'Hardened Snowballs',  desc: '+1 Launcher Damage',    baseCost: 120, costMult: 2.2, maxLevel: 3,  icon: '&#x1F4A5;' }
    };

    const getUpgradeCost = (key, level) => Math.floor(UPGRADE_DEFS[key].baseCost * Math.pow(UPGRADE_DEFS[key].costMult, level));

    const loadUpgrades = () => {
        try {
            const saved = localStorage.getItem('snowman_siege_upgrades');
            if (saved) return JSON.parse(saved);
        } catch (e) {}
        return { maxHp: 0, maxAmmo: 0, reloadSpeed: 0, startWave: 0, damage: 0 };
    };

    const saveUpgrades = (upgrades) => {
        localStorage.setItem('snowman_siege_upgrades', JSON.stringify(upgrades));
    };

    const loadSnowflakes = () => {
        try {
            const saved = localStorage.getItem('snowman_siege_snowflakes');
            if (saved) return parseInt(saved, 10);
        } catch (e) {}
        return 0;
    };

    const saveSnowflakes = (amount) => {
        localStorage.setItem('snowman_siege_snowflakes', amount.toString());
    };

    const getEffectiveStats = (upgrades) => ({
        maxHp:      BASE_MAX_HP + (upgrades.maxHp * 1),
        maxAmmo:    BASE_MAX_AMMO + (upgrades.maxAmmo * 5),
        reloadTime: Math.round(BASE_RELOAD_TIME * Math.pow(0.85, upgrades.reloadSpeed)),
        startWave:  1 + upgrades.startWave,
        damage:     BASE_DAMAGE + upgrades.damage
    });

    // ===== AUDIO =====
    // One shared AudioContext, created/resumed inside a real user gesture
    // (iOS Safari requires this, and caps concurrent contexts).
    let audioCtx = null;
    const initAudio = () => {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (e) {}
    };

    const playSound = (freq, type, duration, volume = 0.1) => {
        try {
            const ctx = audioCtx;
            if (!ctx || ctx.state !== 'running') return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq / 2, ctx.currentTime + duration);
            gain.gain.setValueAtTime(volume, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
        } catch (e) {}
    };

    // ===== SHOP VIEW =====
    const ShopView = ({ onBack, snowflakes, setSnowflakes, upgrades, setUpgrades }) => {
        const handleBuy = (key) => {
            const level = upgrades[key];
            const def = UPGRADE_DEFS[key];
            if (level >= def.maxLevel) return;
            const cost = getUpgradeCost(key, level);
            if (snowflakes < cost) return;
            const newFlakes = snowflakes - cost;
            const newUpgrades = { ...upgrades, [key]: level + 1 };
            setSnowflakes(newFlakes);
            setUpgrades(newUpgrades);
            saveSnowflakes(newFlakes);
            saveUpgrades(newUpgrades);
            initAudio();
            playSound(600, 'sine', 0.15, 0.06);
        };

        const stats = getEffectiveStats(upgrades);

        return (
            <div className="w-full h-full flex flex-col bg-gradient-to-b from-slate-800 to-slate-900 text-white overflow-y-auto">
                <div className="p-4 flex items-center justify-between border-b border-white/10">
                    <button
                        onClick={onBack}
                        className="bg-white/10 px-4 py-2 rounded-xl text-sm font-bold active:scale-95 transition-transform"
                    >
                        &#x2190; BACK
                    </button>
                    <div className="flex items-center gap-2">
                        <span className="text-cyan-300 text-lg">&#x2744;</span>
                        <span className="text-xl font-mono font-bold text-cyan-300">{snowflakes.toLocaleString()}</span>
                    </div>
                </div>

                <div className="p-4">
                    <h2 className="text-2xl font-black tracking-tight mb-1">UPGRADE SHOP</h2>
                    <p className="text-slate-400 text-xs mb-4">Spend snowflakes on permanent upgrades</p>

                    <div className="bg-white/5 rounded-xl p-3 mb-4 text-[11px] text-slate-300 grid grid-cols-2 gap-1">
                        <span>HP: {stats.maxHp}</span>
                        <span>Ammo: {stats.maxAmmo}</span>
                        <span>Reload: {stats.reloadTime}ms</span>
                        <span>Start Wave: {stats.startWave}</span>
                        <span>Damage: {stats.damage}</span>
                    </div>

                    <div className="space-y-3">
                        {Object.entries(UPGRADE_DEFS).map(([key, def]) => {
                            const level = upgrades[key];
                            const maxed = level >= def.maxLevel;
                            const cost = maxed ? 0 : getUpgradeCost(key, level);
                            const canAfford = snowflakes >= cost;

                            return (
                                <button
                                    key={key}
                                    onClick={() => handleBuy(key)}
                                    disabled={maxed || !canAfford}
                                    className="shop-item w-full bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl p-4 flex items-center gap-4 text-left"
                                >
                                    <div className="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center text-2xl flex-shrink-0"
                                         dangerouslySetInnerHTML={{ __html: def.icon }} />
                                    <div className="flex-1 min-w-0">
                                        <div className="flex items-center gap-2 mb-0.5">
                                            <span className="font-bold text-sm">{def.name}</span>
                                            <span className="text-[10px] text-slate-400 font-mono">Lv.{level}/{def.maxLevel}</span>
                                        </div>
                                        <p className="text-[11px] text-slate-400">{def.desc}</p>
                                        <div className="flex gap-0.5 mt-1.5">
                                            {Array.from({ length: def.maxLevel }, (_, i) => (
                                                <div key={i} className={`h-1 flex-1 rounded-full ${i < level ? 'bg-cyan-400' : 'bg-white/10'}`} />
                                            ))}
                                        </div>
                                    </div>
                                    <div className="flex-shrink-0 text-right">
                                        {maxed ? (
                                            <span className="text-xs font-bold text-emerald-400">MAX</span>
                                        ) : (
                                            <div className="flex items-center gap-1">
                                                <span className="text-cyan-300 text-sm">&#x2744;</span>
                                                <span className={`font-mono font-bold text-sm ${canAfford ? 'text-white' : 'text-red-400'}`}>{cost}</span>
                                            </div>
                                        )}
                                    </div>
                                </button>
                            );
                        })}
                    </div>
                </div>
            </div>
        );
    };

    // ===== HOME VIEW =====
    const HomeView = ({ onCampaign, onEndless, onShop, bestScore, snowflakes, selectedBiome, setSelectedBiome, unlockedBiomes, launcher, setLauncher }) => (
        <div className="snow-home w-full h-full flex flex-col items-center justify-center bg-gradient-to-b from-slate-800 to-slate-900 text-white px-6 py-5 overflow-y-auto">
            <div className="mb-4 text-center">
                <h1 className="text-5xl font-black mb-2 tracking-tighter drop-shadow-lg">
                    SNOWMAN<br/>SIEGE
                </h1>
                <p className="text-slate-400 font-medium uppercase tracking-widest text-xs">Winter Arcade Defense</p>
            </div>
            <div className="w-full max-w-xl space-y-3 flex flex-col items-center">
                <div className="w-full grid grid-cols-2 md:grid-cols-4 gap-2">
                    {WINTER_BIOMES.map((biome, i) => <button key={biome.name} disabled={i>unlockedBiomes} onClick={()=>setSelectedBiome(i)} className={`rounded-xl border p-2 text-xs ${selectedBiome===i?'border-cyan-300 bg-cyan-400/20':'border-white/10 bg-white/5'} disabled:opacity-30`}><span className="text-xl block">{i>unlockedBiomes?'🔒':biome.icon}</span><b>{biome.name}</b><small className="block text-[9px] text-white/50 mt-1">Wave {biome.goalWave} · {biome.objective}</small></button>)}
                </div>
                <div className="w-full grid grid-cols-2 md:grid-cols-4 gap-2">
                    {Object.entries(LAUNCHERS).map(([id,item])=><button key={id} onClick={()=>setLauncher(id)} className={`rounded-xl border p-2 text-xs ${launcher===id?'border-yellow-300 bg-yellow-400/15':'border-white/10 bg-white/5'}`}><span className="text-lg">{item.icon}</span> <b>{item.name}</b><small className="block text-[9px] text-white/50">{item.desc}</small></button>)}
                </div>
                <div className="flex gap-3">
                <button onClick={onCampaign} className="bg-white text-slate-900 font-bold px-7 py-3 rounded-full text-lg shadow-xl active:scale-95 transition-transform">CAMPAIGN</button>
                <button onClick={onEndless} className="bg-indigo-500/30 border border-indigo-300/30 text-white font-bold px-7 py-3 rounded-full text-lg active:scale-95">ENDLESS</button>
                </div>
                <button
                    onClick={onShop}
                    className="w-48 bg-cyan-500/20 border border-cyan-400/30 text-cyan-300 font-bold py-3 rounded-full text-base shadow-lg active:scale-95 transition-transform"
                >
                    &#x2744; SHOP
                </button>
                <div className="flex items-center gap-4 mt-2">
                    <div className="text-center">
                        <p className="text-slate-500 text-xs font-bold uppercase mb-1">Best Score</p>
                        <p className="text-2xl font-mono text-yellow-400">{bestScore.toLocaleString()}</p>
                    </div>
                    <div className="w-px h-8 bg-white/10" />
                    <div className="text-center">
                        <p className="text-slate-500 text-xs font-bold uppercase mb-1">Snowflakes</p>
                        <p className="text-2xl font-mono text-cyan-300">&#x2744; {snowflakes.toLocaleString()}</p>
                    </div>
                </div>
            </div>
            <div className="mt-4 text-center text-slate-500 text-[10px] leading-relaxed max-w-[260px]">
                HOLD TO FIRE &bull; RELEASE TO RELOAD<br/>
                DEFEND THE VILLAGE FROM THE FROZEN HORDE
            </div>
        </div>
    );

    // ===== GAME OVER VIEW =====
    const GameOverView = ({ score, bestScore, snowflakesEarned, gameStats, onRestart, onHome }) => {
        const accuracy = gameStats && gameStats.shotsFired > 0
            ? Math.round((gameStats.shotsHit / gameStats.shotsFired) * 100)
            : 0;

        return (
            <div className="absolute inset-0 bg-slate-900/90 backdrop-blur-md flex flex-col items-center justify-center p-8 z-50 overflow-y-auto">
                <div className="text-center mb-6">
                    <h2 className={`${gameStats?.completed?'text-emerald-400':'text-red-500'} text-5xl font-black italic tracking-tighter mb-2`}>{gameStats?.completed?'MISSION CLEAR!':'GAME OVER'}</h2>
                    <p className="text-white/40 uppercase tracking-widest text-xs">{gameStats?.completed?'The winter road is open':'The siege has broken through'}</p>
                </div>
                <div className="bg-white/5 w-full rounded-3xl p-6 mb-4 text-center space-y-4">
                    <div>
                        <p className="text-white/40 text-[10px] uppercase font-bold">Final Score</p>
                        <p className="text-white text-4xl font-mono font-bold">{score.toLocaleString()}</p>
                    </div>
                    <div className="pt-2 border-t border-white/10">
                        <p className="text-white/40 text-[10px] uppercase font-bold">Best Record</p>
                        <p className="text-yellow-400 text-2xl font-mono font-bold">{bestScore.toLocaleString()}</p>
                    </div>
                    <div className="pt-2 border-t border-white/10">

    };

    // ===== GAME HUD VIEW =====
    const GameHUDView = ({ status, onPause, gameConfig }) => {
        const hpCores = Array.from({ length: status.maxHp }, (_, i) => i < status.hp);
        const biome = WINTER_BIOMES[gameConfig.biome] || WINTER_BIOMES[0];
        return (
            <div className="snow-hud absolute inset-0 pointer-events-none p-4 flex flex-col justify-between">

                        <p className="text-white text-2xl font-mono leading-none">{status.score.toLocaleString()}</p>
                        <p className="text-slate-400 text-[10px] font-mono mt-0.5">Wave {status.wave}</p>
                    </div>
                    <button
                        aria-label="Pause game"
                        onClick={onPause}
                        className="pointer-events-auto bg-white/10 backdrop-blur-md p-2 rounded-xl active:scale-90"
                    >
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                            <rect x="6" y="5" width="4" height="14" rx="1" />
                            <rect x="14" y="5" width="4" height="14" rx="1" />

                <div className="snow-objective text-center">
                    <p className="text-cyan-200 text-[10px] font-black uppercase">{gameConfig.mode==='campaign'?`${biome.icon} ${biome.name}`:'♾️ Endless Siege'} · {LAUNCHERS[gameConfig.launcher]?.name}</p>
                    {gameConfig.mode==='campaign'&&<p className="text-white/60 text-[9px]">Goal: Wave {biome.goalWave} + {biome.objective}</p>}
                </div>
                <div className="snow-footer flex flex-col gap-4 pb-4">
                    {status.reloading && (
                        <div className="w-full h-1.5 bg-black/40 rounded-full overflow-hidden">
                            <div
                                className="h-full bg-yellow-400 transition-all duration-75"
                                style={{ width: `${status.reloadProgress * 100}%` }}
                            />
                        </div>
                    )}
                    <div className="flex justify-between items-end">
                        <div className="flex gap-1.5 flex-wrap" style={{ maxWidth: '180px' }}>
                            {hpCores.map((active, i) => (
                                <div
                                    key={i}
                                    className={`w-4 h-6 rounded-sm border-2 transition-colors ${active ? 'bg-red-500 border-red-400 shadow-[0_0_8px_rgba(239,68,68,0.5)]' : 'bg-transparent border-white/20'}`}
                                />

                        </div>
                        <div className="flex flex-col items-end">
                            <p className="text-white/50 text-[10px] font-bold uppercase tracking-widest">Ammo</p>
                            <div className="flex items-baseline gap-1">
                                <span className={`text-2xl font-mono leading-none ${status.ammo < 10 ? 'text-red-500' : 'text-white'}`}>
                                    {status.ammo}
                                </span>
                                <span className="text-white/40 text-sm font-mono">/ {status.maxAmmo}</span>

                    </div>
                    {/* Active power-up indicators */}
                    <div className="flex gap-2 justify-center">
                        {status.rapidFireActive && (
                            <div className="bg-yellow-500/30 border border-yellow-400/50 rounded-lg px-2 py-0.5 text-[10px] font-bold text-yellow-300">RAPID</div>
                        )}
                        {status.spreadShotActive && (
                            <div className="bg-blue-500/30 border border-blue-400/50 rounded-lg px-2 py-0.5 text-[10px] font-bold text-blue-300">SPREAD</div>
                        )}
                        {status.freezeActive && (
                            <div className="bg-cyan-500/30 border border-cyan-400/50 rounded-lg px-2 py-0.5 text-[10px] font-bold text-cyan-300">FREEZE</div>
