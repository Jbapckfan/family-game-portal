    <style>
      * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #050505;
        font-family: -apple-system, BlinkMacSystemFont, 'Avenir Next', 'Segoe UI', sans-serif;
        position: fixed;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #root {
        width: 100%;
        height: 100%;
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        left: env(safe-area-inset-left, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
      }
      /* Feature 2: Custom CSS Scrollbar with Neon Glow */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
        border-radius: 4px;
        border: 1px solid #1a1a2e;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #00f0ff 0%, #007a85 100%);
        border-radius: 4px;
        box-shadow: 0 0 6px rgba(0, 240, 255, 0.5), 0 0 12px rgba(0, 240, 255, 0.2);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #33f5ff 0%, #00b8c8 100%);
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.7), 0 0 20px rgba(0, 240, 255, 0.35);
      }
      ::-webkit-scrollbar-corner { background: #0a0a0a; }
      /* Firefox scrollbar */
      * {
        scrollbar-width: thin;
        scrollbar-color: #00f0ff #0a0a0a;
      }

      /* Feature 1: Loading Screen Styles */
      #loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #050505;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        transition: opacity 0.5s ease-out;
      }
      #loading-overlay.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #loading-overlay .spinner {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 3px solid #1a1a2e;
        border-top-color: #00f0ff;
        animation: loading-spin 0.9s linear infinite;
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      }
      #loading-overlay .loading-text {
        font-family: 'Orbitron', sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: #00f0ff;
        letter-spacing: 6px;
        text-transform: uppercase;
        animation: loading-pulse 1.5s ease-in-out infinite;
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
      }
      #loading-overlay .loading-sub {
        font-family: 'Rajdhani', sans-serif;
        font-size: 13px;
        color: #555;
        letter-spacing: 2px;
      }
      @keyframes loading-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes loading-pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      /* Feature 10: Error Overlay Styles */
      #error-overlay {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: rgba(5, 5, 5, 0.95);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        text-align: center;
      }
      #error-overlay.visible { display: flex; }
      #error-overlay .error-icon {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 2px solid #ff4060;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        color: #ff4060;
        box-shadow: 0 0 20px rgba(255, 64, 96, 0.3);
      }
      #error-overlay .error-title {
        font-family: 'Orbitron', sans-serif;
        font-size: 20px;
        font-weight: 700;
        color: #ff4060;
        letter-spacing: 2px;
      }
      #error-overlay .error-msg {
        font-family: 'Rajdhani', sans-serif;
        font-size: 16px;
        color: #aaa;
        max-width: 400px;
        line-height: 1.5;
      }
      #error-overlay .error-btn {
        margin-top: 8px;
        padding: 12px 32px;
        background: transparent;
        border: 1px solid #ff4060;
        border-radius: 10px;
        color: #ff4060;
        font-family: 'Orbitron', sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.2s;
        min-height: 44px;
      }
      #error-overlay .error-btn:hover {
        background: rgba(255, 64, 96, 0.15);
        box-shadow: 0 0 15px rgba(255, 64, 96, 0.3);
      }

      /* Feature 3: Fullscreen Toggle Button */
      #fullscreen-btn {
        position: fixed;
        bottom: 12px;
        right: 12px;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        padding: 8px 12px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: background 0.2s;
        min-height: 44px;
        min-width: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        line-height: 1;
      }
      #fullscreen-btn:hover { background: rgba(0, 0, 0, 0.9); }
      #fullscreen-btn svg { width: 18px; height: 18px; fill: #fff; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      @media (max-width: 600px) {
        #fullscreen-btn {
          top: 12px;
          bottom: auto;
        }
        .velocity-hud {

        }
        .velocity-checkpoints {

        }
        .velocity-speed {

        }
        .velocity-speed .text-6xl {

        }
        .velocity-speed .w-64 {
          width: 180px;
        }
        .velocity-instructions {
          display: none;
        }
      }
    </style>

    <script>
      (function() {
        var userAgent = navigator.userAgent || '';
        var isIPad = /iPad/i.test(userAgent) ||
          (/Macintosh/i.test(userAgent) && navigator.maxTouchPoints > 1);
        var forcedLite = false;
        try {
          forcedLite = localStorage.getItem('velocity-force-lite') === '1';
        } catch (error) {}
        var lowMemory = typeof navigator.deviceMemory === 'number' && navigator.deviceMemory <= 4;

        window.__velocityLiteMode = isIPad || lowMemory || forcedLite;
        window.__velocityBootState = { moduleLoaded: false, appMounted: false };
        window.__velocityBootError = function(message) {
          window.__velocityPendingError = message || 'The game could not start on this device.';
          if (window.__velocityShowBootError) {
            window.__velocityShowBootError(window.__velocityPendingError);
          }
        };
        window.__velocityEnableSafeMode = function() {
          try {
            localStorage.setItem('velocity-force-lite', '1');
          } catch (error) {}
          location.reload();
        };
      })();
    </script>

  <!-- Feature 1: Loading Screen - MutationObserver to detect app mount -->
  <script>
    (function() {
      var overlay = document.getElementById('loading-overlay');
      var root = document.getElementById('root');
      if (!overlay || !root) return;

      function finishLoading() {
        if (window.__velocityBootState) window.__velocityBootState.appMounted = true;
        overlay.classList.add('fade-out');
        setTimeout(function() {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 600);
        observer.disconnect();
      }

      function appIsReady() {
        return !!root.querySelector('canvas');
      }

      var observer = new MutationObserver(function() {
        if (appIsReady()) {
          finishLoading();
        }
      });
      observer.observe(root, { childList: true, subtree: true });

      // Never leave an iPad staring at a blank screen if WebGL or the module fails.
      setTimeout(function() {
        if (appIsReady()) {
          finishLoading();
        } else {
          observer.disconnect();
          window.__velocityBootError('The 3D track did not initialize. Retry in Safe Mode; if it still fails, update iPadOS and reload.');
        }
      }, 15000);
    })();
  </script>

  <!-- Feature 3: Fullscreen Toggle - Inline Script -->
  <script>
    (function() {
      var btn = document.getElementById('fullscreen-btn');
      var iconEnter = document.getElementById('fs-icon-enter');
      var iconExit = document.getElementById('fs-icon-exit');
      if (!btn || !document.fullscreenEnabled && !document.webkitFullscreenEnabled) {
        if (btn) btn.style.display = 'none';
        return;
      }

      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }

      function updateIcon() {
        var fs = isFullscreen();
        iconEnter.style.display = fs ? 'none' : 'block';
        iconExit.style.display = fs ? 'block' : 'none';
      }

      btn.addEventListener('click', function() {
        if (isFullscreen()) {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else {
          var el = document.documentElement;
          if (el.requestFullscreen) el.requestFullscreen();
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        }
      });

      document.addEventListener('fullscreenchange', updateIcon);
      document.addEventListener('webkitfullscreenchange', updateIcon);
    })();
  </script>

  <!-- Feature 10: Error Boundary - Global Error Handlers -->
  <script>
    (function() {
      var errorOverlay = document.getElementById('error-overlay');
      var hasShown = false;

      function showError(message) {
        if (!errorOverlay) return;
        var messageElement = errorOverlay.querySelector('.error-msg');
        if (message && messageElement) messageElement.textContent = message;
        if (hasShown) return;
        hasShown = true;
        errorOverlay.classList.add('visible');
        // Hide the loading overlay if still present
        var loadingOverlay = document.getElementById('loading-overlay');
        if (loadingOverlay && loadingOverlay.parentNode) {
          loadingOverlay.parentNode.removeChild(loadingOverlay);
        }
      }

      window.__velocityShowBootError = showError;
      if (window.__velocityPendingError) showError(window.__velocityPendingError);

      // Catch uncaught JS errors (only show for fatal-looking errors, not minor warnings)
      window.addEventListener('error', function(e) {
        // Skip errors from extensions or cross-origin scripts
        if (e.filename && e.filename.indexOf(location.origin) === -1) return;
        // Show for errors that are likely to break the game
        if (e.message && (
          /webgl/i.test(e.message) ||
          /context/i.test(e.message) ||
          /out of memory/i.test(e.message) ||
          /cannot read/i.test(e.message) ||
          /is not defined/i.test(e.message) ||
          /null/i.test(e.message) ||
          /undefined/i.test(e.message) ||
          /failed to/i.test(e.message)
        )) {
          showError('The iPad lost its 3D graphics context. Retry in Safe Mode.');
        }
      });

      // Catch unhandled promise rejections
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (/webgl/i.test(msg) || /context/i.test(msg) || /chunk/i.test(msg) ||
            /loading/i.test(msg) || /network/i.test(msg) || /failed/i.test(msg) ||
            /module/i.test(msg)) {
          showError('A required game resource did not finish loading. Retry in Safe Mode.');
        }
      });

      // Catch WebGL context loss directly
      document.addEventListener('webglcontextlost', function(e) {
        e.preventDefault();
        showError('The iPad lost its 3D graphics context. Retry in Safe Mode.');
      }, true);
    })();
  </script>
