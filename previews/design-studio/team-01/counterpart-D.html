<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counterpart · Concept D · Sentence Focus</title>
<link rel="stylesheet" href="studio.css?theme=2">
<style>
.focus{max-width:860px;margin:0 auto}
.rail{display:flex;gap:4px;margin:4px 0 22px}
.rail button{flex:1;min-height:44px;border:0;background:transparent;padding:0;display:grid;align-content:end;gap:6px;font:600 11px/1 var(--mono);color:var(--muted);text-align:left}
.rail button::after{content:"";height:5px;border-radius:3px;background:var(--line)}
.rail button[aria-current="true"]{color:var(--ink)} .rail button[aria-current="true"]::after{background:var(--ink)}
.rail button.ok::after{background:var(--ok)}
.sentence{font:400 clamp(24px,7vw,46px)/1.3 var(--serif);color:var(--ink);margin:0;overflow-wrap:anywhere}
.sentence .k{font:700 .9em/1 var(--display);letter-spacing:0}
.sentence .is{color:var(--muted);font-style:italic}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:4.6em;min-height:1.35em;padding:0 .25em;margin:.08em 0;border-bottom:3px solid var(--ink);font:700 .9em/1 var(--display);color:var(--blue-ink);vertical-align:baseline;border-radius:0;background:transparent;border-top:0;border-left:0;border-right:0}
.blank.cur{border-bottom-color:var(--blue);background:var(--blue-wash)}
.blank:empty::before{content:attr(data-ph);color:var(--faint);font:500 .5em var(--sans);letter-spacing:.1em}
.dirline{display:flex;gap:10px;align-items:center;margin:16px 0 0;font-size:14px;color:var(--muted);flex-wrap:wrap}
.dirline b{color:var(--ink2)}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:26px}
@media (min-width:640px){.keys{grid-template-columns:repeat(5,minmax(0,1fr))}}
.key{min-height:56px;border-radius:14px;border:1px solid var(--line);border-bottom:2px solid var(--edge);background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 10px;font:700 clamp(13px,3.8vw,16px)/1.1 var(--sans);letter-spacing:.02em;text-align:left;overflow-wrap:anywhere}
.key kbd{flex:none;font:700 11px/1 var(--mono);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--line2);color:var(--muted)}
.key[aria-pressed="true"]{border-color:var(--blue);border-bottom-color:var(--blue-ink);background:var(--blue-wash)}
.key[aria-pressed="true"] kbd{background:var(--blue);color:#fff}
.key:disabled{opacity:.32}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.acts .btn{flex:1 1 120px}
.nav{display:flex;justify-content:space-between;margin-top:18px}
</style>
<link rel="stylesheet" href="../assets/site-theme.css?theme=2">
</head>
<body>
<div class="rv"><span><b>Counterpart · Concept D “Sentence Focus”</b> · design review prototype, not a live game</span><nav aria-label="Counterpart concepts"><a href="counterpart-A.html?theme=2">A</a><a href="counterpart-B.html?theme=2">B</a><a href="counterpart-C.html?theme=2">C</a><a href="counterpart-D.html?theme=2" aria-current="page">D</a></nav></div>
<main class="app">
<header class="bar"><a class="brand" href="#" aria-label="Alford Daily, all games"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><img src="../assets/brand.svg" alt="">Alford <span>Daily</span></a>
<button class="ibtn" aria-pressed="false" aria-label="Favorite Counterpart" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')!=='true')"><svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button>
<button class="ibtn" aria-label="Hide Counterpart from your collection"><svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 4.5 10 6-.4.7-1.5 2.1-3 3.5M6.2 7.6C4.3 8.9 2.7 10.8 2 12c1 1.5 5 6 10 6 1.5 0 2.9-.4 4.1-1"/><path d="M9.9 10a3 3 0 0 0 4.1 4.1"/></svg></button>
<button class="ibtn" aria-label="How to play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6M12 17h.01"/></svg></button></header>
<section class="head"><img src="../assets/icons/counterpart.svg" alt=""><div><h1>Counterpart</h1><div class="meta">NO. 018 · TRICKY · 1 CHECK · 0 HINTS</div></div><div class="seg"><button aria-pressed="true">Daily</button><button aria-pressed="false">Practice</button></div></section>
<div class="wrap"><div class="focus">
  <nav class="rail" id="rail" aria-label="Analogies"></nav>
  <p class="sentence" id="sent" aria-live="polite"></p>
  <p class="dirline"><b>Read it aloud.</b> The first blank plays the role of <span id="r0">PRISM</span>; the second plays <span id="r1">SPECTRUM</span>.</p>
  <div class="keys" id="keys"></div>
  <div class="acts"><button class="btn" id="rev">⇄ Reverse <span class="kbd">R</span></button><button class="btn" id="hint">✦ Hint</button><button class="btn pri" id="chk">Check <span class="kbd" style="background:transparent;color:var(--bg);border-color:rgba(246,243,236,.45)">Enter</span></button></div>
  <p class="live" id="msg" style="margin-top:12px"></p>
  <div class="nav"><button class="btn ghost" id="prev">← Previous</button><button class="btn ghost" id="next">Next →</button></div>
</div></div>
<div class="foot"><span>Keys <span class="kbd">1</span>–<span class="kbd">0</span> pick words · <span class="kbd">⌫</span> clears · <span class="kbd">←</span><span class="kbd">→</span> change analogy</span><a href="#">Full rules</a></div>
</main>
<script>
const ROWS=[['THESIS','ARGUMENT'],['PRISM','SPECTRUM'],['SHELL','TURTLE'],['BASS','LOW'],['INVOICE','PAYMENT']];
const BANK=['HIGH','SOLDIER','PROOF','KILN','APPEARANCE','ARMOR','SUMMONS','SOPRANO','CERAMICS','THEOREM'];
const SOLVED={2:['ARMOR','SOLDIER']};
let drafts=ROWS.map(()=>[null,null]);drafts[1]=['KILN',null];
let row=1,slot=1;
const $=id=>document.getElementById(id);
function render(){
  const s=SOLVED[row],d=s||drafts[row],used=new Set(Object.values(SOLVED).flat());
  $('rail').innerHTML=ROWS.map((r,i)=>`<button data-r="${i}" ${i===row?'aria-current="true"':''} class="${SOLVED[i]?'ok':''}">${String(i+1).padStart(2,'0')}${SOLVED[i]?' ✓':''}</button>`).join('');
  $('sent').innerHTML=`<span class="k">${ROWS[row][0]}</span> <span class="is">is to</span> <span class="k">${ROWS[row][1]}</span> <span class="is">as</span> <button class="blank${!s&&slot===0?' cur':''}" data-s="0" data-ph="FIRST" aria-label="First blank: ${d[0]||'empty'}">${d[0]||''}</button> <span class="is">is to</span> <button class="blank${!s&&slot===1?' cur':''}" data-s="1" data-ph="SECOND" aria-label="Second blank: ${d[1]||'empty'}">${d[1]||''}</button>`;
  $('r0').textContent=ROWS[row][0];$('r1').textContent=ROWS[row][1];
  $('keys').innerHTML=BANK.map((w,i)=>`<button class="key" data-w="${w}" aria-pressed="${d.includes(w)}" ${used.has(w)||s?'disabled':''}><kbd>${(i+1)%10}</kbd>${w}</button>`).join('');
  $('chk').disabled=!!s||!(d[0]&&d[1]);
}
function pick(w){const d=drafts[row],k=d.indexOf(w);if(SOLVED[row])return;if(k>=0){d[k]=null;slot=k;}else{d[slot]=w;slot=d[0]?(d[1]?slot:1):0;}render();}
$('keys').onclick=e=>{const b=e.target.closest('[data-w]');if(b)pick(b.dataset.w);};
$('sent').onclick=e=>{const b=e.target.closest('[data-s]');if(b){slot=+b.dataset.s;render();}};
$('rail').onclick=e=>{const b=e.target.closest('[data-r]');if(b){row=+b.dataset.r;slot=drafts[row][0]?1:0;$('msg').textContent='';render();}};
$('prev').onclick=()=>{row=(row+4)%5;render();};$('next').onclick=()=>{row=(row+1)%5;render();};
$('rev').onclick=()=>{drafts[row].reverse();render();$('msg').textContent='Reversed. Read the sentence again.';};
$('hint').onclick=()=>{$('msg').textContent='After confirmation (+1 hint), the relationship name appears under the sentence. Not wired in this prototype.';};
$('chk').onclick=()=>{$('msg').textContent='The live engine checks here. Not wired in this prototype.';};
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;if(/^[0-9]$/.test(e.key)){const i=(+e.key+9)%10;pick(BANK[i]);}else if(e.key==='r'||e.key==='R'){$('rev').click();}else if(e.key==='Backspace'){e.preventDefault();drafts[row]=[null,null];slot=0;render();}else if(e.key==='ArrowRight')$('next').click();else if(e.key==='ArrowLeft')$('prev').click();else if(e.key==='Enter'&&!$('chk').disabled&&!(e.target.closest&&e.target.closest('button')))$('chk').click();});
render();
</script>
</body></html>
